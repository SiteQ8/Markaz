.","Logs are centralized into a logging solution where feasible.","Access to logs is restricted to authorized personnel only.","Logs are protected from unauthorized modification or deletion.","Changes to logging configuration are themselves logged.","Logs are retained at least 90 days live.","Logs are retained at least 12 months in total, live or archived.","Logs are reviewed for suspicious activity at a frequency matched to entity risk."],"ckAr":["تسجيل التدقيق مفعل على الأنظمة الحرجة.","تسجيل التدقيق مفعل على أجهزة الشبكة.","تسجيل التدقيق مفعل على أدوات الأمن.","تسجيل التدقيق مفعل على التطبيقات الرئيسية.","أحداث المصادقة مسجلة.","الإجراءات الإدارية مسجلة.","الأحداث الأمنية المهمة مسجلة.","تجمع السجلات مركزيا في نظام تسجيل مركزي متى أمكن.","الوصول إلى السجلات مقصور على المخولين فقط.","السجلات محمية من التعديل أو الحذف غير المصرح به.","تسجل التغييرات على إعدادات التسجيل هي نفسها.","تحفظ السجلات تسعين يوما على الأقل بصورة حية.","تحفظ السجلات اثني عشر شهرا على الأقل إجمالا حية كانت أو مؤرشفة.","تراجع السجلات بحثا عن نشاط مشبوه بوتيرة تناسب مخاطر الجهة."],"ph":2,"ef":"high","csf":["DE.CM-01","DE.CM-03","PR.PS-04"],"cis":["8.1","8.2","8.5","8.9","8.10","8.11"],"iso":["A.8.15","A.8.16"]},{"id":"DE-2","fn":"DE","t":"Time Synchronization","tAr":"مزامنة الوقت","r":"Ensure all information systems (servers, workstations, network devices) synchronize their system clocks to a reliable, authoritative time source (e.g., NTP). Timestamps in logs MUST be consistent across the infrastructure. Periodically verify that system clocks remain in sync (for example, by comparing log timestamps from different systems).","rAr":"تضمن الجهة أن تزامن جميع أنظمة المعلومات، من خوادم ومحطات عمل وأجهزة شبكة، ساعاتها مع مصدر زمني موثوق ومعتمد مثل بروتوكول توقيت الشبكة، ويجب أن تكون الطوابع الزمنية في السجلات متسقة عبر البنية التحتية، مع التحقق دوريا من بقاء ساعات الأنظمة متزامنة وذلك مثلا بمقارنة الطوابع الزمنية الواردة من أنظمة مختلفة.","p":"Ensure consistent timestamps across systems to facilitate incident investigation.","pAr":"ضمان اتساق الطوابع الزمنية بين الأنظمة لتيسير التحقيق في الحوادث.","ep":null,"epAr":null,"ck":["Servers synchronize their clocks to a reliable authoritative time source.","Workstations synchronize their clocks to a reliable authoritative time source.","Network devices synchronize their clocks to a reliable authoritative time source.","Log timestamps are consistent across the infrastructure.","System clock synchronization is verified periodically."],"ckAr":["تزامن الخوادم ساعاتها مع مصدر زمني موثوق ومعتمد.","تزامن محطات العمل ساعاتها مع مصدر زمني موثوق ومعتمد.","تزامن أجهزة الشبكة ساعاتها مع مصدر زمني موثوق ومعتمد.","الطوابع الزمنية في السجلات متسقة عبر البنية التحتية.","تزامن ساعات الأنظمة يتحقق منه دوريا."],"ph":1,"ef":"low","csf":["DE.CM-01","PR.PS-01"],"cis":["8.4"],"iso":["A.8.17"]},{"id":"RS-1","fn":"RS","t":"Incident Reporting to NCSC & Leadership","tAr":"الإبلاغ عن الحوادث للمركز وللإدارة العليا","r":"Establish and communicate a simple incident reporting process so that staff know how to report suspected incidents (for example, phishing, data loss, or system compromise). Appoint one person as the incident response lead and at least one backup to coordinate incident handling, even if external service providers are used. Maintain up-to-date contact details for the incident lead, backup, relevant service providers, and NCSC. Where an actual or suspected cybersecurity incident or threat may be reportable under NCSC-issued incident management or reporting guidance, the Entity MUST notify NCSC promptly through the official channels and within the applicable timelines set by NCSC. Where appropriate, the Entity MUST use out-of-band communication channels during active incidents or where normal channels may be affected. The Entity MUST provide follow-up updates and information as required by applicable NCSC reporting guidance.","rAr":"تنشئ الجهة آلية مبسطة للإبلاغ عن الحوادث وتعممها بحيث يعرف الموظفون كيف يبلغون عن الحوادث المشتبه بها، ومنها مثلا التصيد أو فقد البيانات أو اختراق الأنظمة، وتعين شخصا واحدا مسؤولا عن الاستجابة للحوادث وبديلا واحدا على الأقل لتنسيق التعامل معها حتى مع الاستعانة بمزودي خدمة خارجيين، وتحفظ بيانات اتصال محدثة للمسؤول وبديله ولمزودي الخدمة المعنيين وللمركز، وحيثما كان الحادث أو التهديد السيبراني القائم أو المشتبه به مما يجب الإبلاغ عنه بموجب إرشادات المركز في إدارة الحوادث أو الإبلاغ عنها، وجب على الجهة إخطار المركز فورا عبر القنوات الرسمية وضمن المهل التي يحددها، وعند الاقتضاء يجب على الجهة استخدام قنوات اتصال بديلة أثناء الحوادث النشطة أو حين تتأثر القنوات المعتادة، كما يجب عليها تقديم التحديثات والمعلومات اللاحقة وفق إرشادات الإبلاغ المعمول بها لدى المركز.","p":"Ensure serious incidents are reported to NCSC and handled by designated leaders.","pAr":"ضمان الإبلاغ عن الحوادث الجسيمة للمركز وإسناد معالجتها إلى مسؤولين محددين.","ep":null,"epAr":null,"ck":["A simple incident reporting process is established.","The reporting process is communicated so staff know how to report suspected incidents.","One person is appointed as incident response lead.","At least one backup to the incident response lead is appointed.","The appointment holds even where external service providers are used.","Contact details are current for the incident lead and backup.","Contact details are current for relevant service providers.","Contact details are current for NCSC.","Reportable incidents are notified to NCSC promptly through official channels.","Notification meets the applicable timelines set by NCSC.","Out of band communication channels are available for use during active incidents.","Follow up updates are provided to NCSC as required by reporting guidance."],"ckAr":["توجد آلية مبسطة للإبلاغ عن الحوادث.","آلية الإبلاغ معممة بحيث يعرف الموظفون كيف يبلغون عن الحوادث المشتبه بها.","يعين شخص واحد مسؤولا عن الاستجابة للحوادث.","يعين بديل واحد على الأقل لمسؤول الاستجابة للحوادث.","التعيين قائم حتى مع الاستعانة بمزودي خدمة خارجيين.","بيانات الاتصال محدثة لمسؤول الحوادث وبديله.","بيانات الاتصال محدثة لمزودي الخدمة المعنيين.","بيانات الاتصال محدثة للمركز.","تبلغ الحوادث الواجب الإبلاغ عنها للمركز فورا عبر القنوات الرسمية.","يلتزم الإبلاغ بالمهل التي يحددها المركز.","تتوافر قنوات اتصال بديلة للاستخدام أثناء الحوادث النشطة.","تقدم التحديثات اللاحقة للمركز وفق إرشادات الإبلاغ."],"ph":1,"ef":"medium","csf":["RS.CO-02","RS.CO-03","RS.MA-01"],"cis":["17.1","17.2","17.3","17.5"],"iso":["A.5.24","A.5.25","A.6.8"]},{"id":"RS-2","fn":"RS","t":"Basic Incident Handling & Coordination","tAr":"التعامل الأساسي مع الحوادث والتنسيق بشأنها","r":"Maintain a short written incident response procedure that covers: initial triage, containment, communication, evidence preservation, recovery, and reporting/escalation (including when and how to notify NCSC and other regulators or law enforcement). When NCSC or another competent authority notifies the entity of a potential incident, promptly triage and investigate, take reasonable remedial actions, and provide feedback where requested. After significant incidents, perform a brief lessons-learned review and record key improvements to be implemented, and share relevant lessons learned with NCSC or sector authorities where appropriate.","rAr":"تحفظ الجهة إجراء مكتوبا موجزا للاستجابة للحوادث يغطي الفرز الأولي والاحتواء والتواصل وحفظ الأدلة والتعافي والإبلاغ والتصعيد بما في ذلك متى وكيف يخطر المركز وسائر الجهات الرقابية أو جهات إنفاذ القانون، وحين يخطر المركز أو جهة مختصة أخرى الجهة بحادث محتمل، تفرزه وتحقق فيه فورا وتتخذ إجراءات معالجة معقولة وتقدم تغذية راجعة عند طلبها، وبعد الحوادث الجوهرية تجري مراجعة موجزة للدروس المستفادة وتسجل التحسينات الرئيسية الواجب تنفيذها وتشارك الدروس ذات الصلة مع المركز أو جهات القطاع عند الاقتضاء.","p":"Provide a structured but simple way to handle incidents and cooperate with NCSC.","pAr":"توفير أسلوب منظم وبسيط لمعالجة الحوادث والتعاون مع المركز.","ep":null,"epAr":null,"ck":["A written incident response procedure exists.","The procedure covers initial triage.","The procedure covers containment.","The procedure covers communication.","The procedure covers evidence preservation.","The procedure covers recovery.","The procedure covers reporting and escalation including NCSC, regulators and law enforcement.","Notifications from NCSC or another competent authority are triaged and investigated promptly.","Reasonable remedial actions are taken in response to such notifications.","Feedback is provided to the notifying authority where requested.","A lessons learned review follows every significant incident.","Key improvements from lessons learned are recorded.","Relevant lessons learned are shared with NCSC or sector authorities where appropriate."],"ckAr":["يوجد إجراء مكتوب للاستجابة للحوادث.","يغطي الإجراء الفرز الأولي.","يغطي الإجراء الاحتواء.","يغطي الإجراء التواصل.","يغطي الإجراء حفظ الأدلة.","يغطي الإجراء التعافي.","يغطي الإجراء الإبلاغ والتصعيد شاملا المركز والجهات الرقابية وجهات إنفاذ القانون.","تفرز الإخطارات الواردة من المركز أو من جهة مختصة أخرى ويحقق فيها فورا.","تتخذ إجراءات معالجة معقولة استجابة لتلك الإخطارات.","تقدم تغذية راجعة للجهة المخطرة عند طلبها.","تجرى مراجعة للدروس المستفادة عقب كل حادث جوهري.","التحسينات الرئيسية المستخلصة من الدروس المستفادة مسجلة.","تشارك الدروس المستفادة ذات الصلة مع المركز أو جهات القطاع عند الاقتضاء."],"ph":2,"ef":"medium","csf":["RS.MA-02","RS.MI-01","RS.AN-03","ID.IM-04"],"cis":["17.4","17.6","17.8"],"iso":["A.5.26","A.5.27","A.5.28"]},{"id":"RC-1","fn":"RC","t":"Recovery Planning","tAr":"التخطيط للتعافي","r":"Maintain a simple recovery plan or documented procedures for restoring critical systems and services after incidents or other disruptions. The plan SHOULD reference backup locations, key contacts, and any sequencing needed for restoration, especially for Sensitive and Restricted data. Review and update the plan at least annually and after major changes.","rAr":"تحفظ الجهة خطة تعاف مبسطة أو إجراءات موثقة لاستعادة الأنظمة والخدمات الحرجة بعد الحوادث أو غيرها من حالات التعطل، وينبغي أن تشير الخطة إلى مواقع النسخ الاحتياطية وجهات الاتصال الرئيسية وأي ترتيب لازم لعمليات الاستعادة ولا سيما بالنسبة للبيانات الحساسة والمقيدة، وتراجع الخطة وتحدث سنويا على الأقل وبعد التغييرات الجوهرية.","p":"Support structured recovery after incidents and disruptions.","pAr":"دعم التعافي المنظم بعد الحوادث والاضطرابات.","ep":null,"epAr":null,"ck":["A recovery plan or documented restoration procedures exist for critical systems and services.","The plan references backup locations.","The plan references key contacts.","The plan sets out any sequencing needed for restoration.","Sequencing gives particular attention to Sensitive and Restricted data.","The plan is reviewed and updated at least annually.","The plan is reviewed and updated after major changes."],"ckAr":["توجد خطة تعاف أو إجراءات استعادة موثقة للأنظمة والخدمات الحرجة.","تشير الخطة إلى مواقع النسخ الاحتياطية.","تشير الخطة إلى جهات الاتصال الرئيسية.","تبين الخطة أي ترتيب لازم لعمليات الاستعادة.","يولي الترتيب عناية خاصة للبيانات الحساسة والمقيدة.","تراجع الخطة وتحدث سنويا على الأقل.","تراجع الخطة وتحدث عقب التغييرات الجوهرية."],"ph":2,"ef":"medium","csf":["RC.RP-01","RC.RP-03"],"cis":["11.1","17.4"],"iso":["A.5.29","A.5.30"]},{"id":"RC-2","fn":"RC","t":"Testing & Continuous Improvement","tAr":"الاختبار والتحسين المستمر","r":"Conduct basic recovery or continuity tests (for example, tabletop exercises or partial restoration tests) for critical systems at least annually. After tests or real incidents, capture lessons learned, update procedures and controls where practical, and track completion of agreed improvements.","rAr":"تجري الجهة اختبارات أساسية للتعافي أو الاستمرارية للأنظمة الحرجة سنويا على الأقل، ومنها مثلا التمارين المكتبية أو اختبارات الاستعادة الجزئية، وبعد الاختبارات أو الحوادث الفعلية توثق الدروس المستفادة وتحدث الإجراءات والضوابط حيثما كان ذلك عمليا وتتابع إنجاز التحسينات المتفق عليها.","p":"Ensure recovery works in practice and improvements are implemented.","pAr":"التأكد من نجاعة التعافي عمليا وتنفيذ التحسينات.","ep":null,"epAr":null,"ck":["Recovery or continuity tests are conducted for critical systems at least annually.","Tests take a recognizable form such as a tabletop exercise or partial restoration test.","Lessons learned are captured after tests.","Lessons learned are captured after real incidents.","Procedures and controls are updated where practical.","Completion of agreed improvements is tracked."],"ckAr":["تجرى اختبارات التعافي أو الاستمرارية للأنظمة الحرجة سنويا على الأقل.","تتخذ الاختبارات صورة معروفة كتمرين مكتبي أو اختبار استعادة جزئي.","توثق الدروس المستفادة عقب الاختبارات.","توثق الدروس المستفادة عقب الحوادث الفعلية.","تحدث الإجراءات والضوابط حيثما كان ذلك عمليا.","يتابع إنجاز التحسينات المتفق عليها."],"ph":3,"ef":"medium","csf":["ID.IM-02","RC.RP-05"],"cis":["11.5","17.7"],"iso":["A.5.30"]},{"id":"CLD-1","fn":"CLD","t":"Regulatory Authorization","tAr":"الترخيص التنظيمي","r":"Entities MUST ensure the Cloud Service Provider (CSP) is authorized to operate in the State of Kuwait in accordance with regulations issued by the relevant national authorities","rAr":"يجب على الجهات التأكد من أن مزود الخدمة السحابية مرخص له بالعمل في دولة الكويت وفقا للوائح الصادرة عن الجهات الوطنية المختصة","p":null,"pAr":null,"ep":"Confirm the provider may lawfully operate in Kuwait before it is engaged.","epAr":"التحقق من أحقية المزود في العمل داخل الكويت قبل التعاقد معه.","ck":["Every cloud service provider in use is authorized to operate in the State of Kuwait.","Authorization is verified against regulations issued by the relevant national authorities.","Verification is recorded before the provider is engaged."],"ckAr":["كل مزود خدمة سحابية مستخدم مرخص له بالعمل في دولة الكويت.","يتحقق من الترخيص مقابل اللوائح الصادرة عن الجهات الوطنية المختصة.","يوثق التحقق قبل التعاقد مع المزود."],"ph":1,"ef":"low","csf":["GV.SC-03","GV.OC-03"],"cis":["15.1"],"iso":["A.5.19","A.5.31"]},{"id":"CLD-2","fn":"CLD","t":"Provider Due Diligence","tAr":"العناية الواجبة بمزود الخدمة","r":"Prior to selection, Entities MUST evaluate the CSP’s security posture. This requirement is satisfied by reviewing the CSP’s valid, independent international security certifications (e.g., ISO 27001, SOC 2 Type II, CSA STAR Level 2).","rAr":"يجب على الجهات قبل الاختيار تقييم الوضع الأمني لمزود الخدمة السحابية، ويستوفى هذا المتطلب بمراجعة الشهادات الأمنية الدولية المستقلة السارية لدى المزود مثل الأيزو 27001 وSOC 2 Type II وCSA STAR المستوى الثاني.","p":null,"pAr":null,"ep":"Evaluate the security posture of the provider before selection.","epAr":"تقييم الوضع الأمني للمزود قبل اختياره.","ck":["The security posture of the provider is evaluated before selection.","The evaluation reviews valid independent international security certifications.","Certification validity dates are checked and recorded."],"ckAr":["يقيم الوضع الأمني للمزود قبل اختياره.","يراجع التقييم الشهادات الأمنية الدولية المستقلة السارية.","تواريخ سريان الشهادات تفحص وتوثق."],"ph":1,"ef":"low","csf":["GV.SC-06","GV.SC-07"],"cis":["15.3","15.5"],"iso":["A.5.19","A.5.21"]},{"id":"CLD-3","fn":"CLD","t":"Right to Audit (Third-Party Assurance)","tAr":"حق التدقيق (تأكيدات الأطراف الخارجية)","r":"Contracts MUST include a \"Right to Audit.\" To protect the security of multi-tenant environments, this right is exercised by the Entity reviewing the CSP’s independent Third-Party Audit Reports (e.g., SOC 2, C5) rather than conducting physical data center visits.","rAr":"يجب أن تتضمن العقود حق التدقيق، وحماية لأمن البيئات متعددة المستأجرين يمارس هذا الحق بمراجعة الجهة لتقارير التدقيق المستقلة الصادرة عن طرف ثالث لدى المزود مثل SOC 2 وC5 بدلا من إجراء زيارات مادية لمراكز البيانات.","p":null,"pAr":null,"ep":"Preserve assurance over a shared environment without physical inspection.","epAr":"الحصول على تأكيد بشأن البيئة المشتركة دون الحاجة إلى زيارة ميدانية.","ck":["Every cloud contract includes a right to audit clause.","The right is exercised by reviewing independent third party audit reports.","Reports are obtained and reviewed rather than physical data center visits being sought."],"ckAr":["يتضمن كل عقد سحابي بندا بحق التدقيق.","يمارس الحق عبر مراجعة تقارير تدقيق مستقلة من طرف ثالث.","تطلب التقارير وتراجع بدلا من السعي لزيارة مراكز البيانات ماديا."],"ph":2,"ef":"low","csf":["GV.SC-05","GV.SC-07"],"cis":["15.5"],"iso":["A.5.22","A.5.35"]},{"id":"CLD-4","fn":"CLD","t":"Incident Notification Clause","tAr":"شرط الإخطار بالحوادث","r":"Contracts MUST include a commitment from the CSP to notify the Entity of a confirmed data incident without undue delay to allow for accurate investigation and reporting.","rAr":"يجب أن تتضمن العقود التزاما من مزود الخدمة السحابية بإخطار الجهة بأي حادث مؤكد يمس البيانات دون تأخير غير مبرر بما يتيح التحقيق والإبلاغ على نحو دقيق.","p":null,"pAr":null,"ep":"Guarantee the entity learns of provider side incidents in time to act.","epAr":"ضمان علم الجهة بحوادث المزود في وقت يسمح لها بالتصرف.","ck":["Every cloud contract commits the provider to notify the entity of a confirmed data incident.","The commitment requires notification without undue delay.","The notification path feeds the entity incident process under RS-1."],"ckAr":["يلزم كل عقد سحابي المزود بإخطار الجهة عند تأكد وقوع حادث يمس البيانات.","يشترط الالتزام الإخطار دون تأخير غير مبرر.","مسار الإخطار يغذي آلية الحوادث لدى الجهة وفق الضابط RS-1."],"ph":1,"ef":"low","csf":["GV.SC-08","RS.CO-02"],"cis":["15.6","17.2"],"iso":["A.5.22","A.5.24"]},{"id":"CLD-5","fn":"CLD","t":"Data Ownership & Exit","tAr":"ملكية البيانات وإنهاء الخدمة","r":"The contract MUST explicitly state that the Entity retains exclusive ownership of their data. The CSP MUST provide tools or standard APIs to allow the Entity to retrieve their data upon contract termination.","rAr":"يجب أن ينص العقد صراحة على احتفاظ الجهة بالملكية الحصرية لبياناتها، ويجب على مزود الخدمة السحابية توفير أدوات أو واجهات برمجية قياسية تمكن الجهة من استرجاع بياناتها عند إنهاء العقد.","p":null,"pAr":null,"ep":"Keep ownership with the entity and keep exit technically possible.","epAr":"إبقاء ملكية البيانات لدى الجهة وإبقاء إنهاء الخدمة ممكنا من الناحية التقنية.","ck":["The contract explicitly states that the entity retains exclusive ownership of its data.","The provider offers tools or standard APIs for data retrieval on termination.","The retrieval route is identified and understood before it is needed."],"ckAr":["ينص العقد صراحة على احتفاظ الجهة بالملكية الحصرية لبياناتها.","يوفر المزود أدوات أو واجهات برمجية قياسية لاسترجاع البيانات عند الإنهاء.","مسار الاسترجاع محدد ومفهوم قبل الحاجة إليه."],"ph":2,"ef":"low","csf":["GV.SC-10","ID.AM-08"],"cis":["15.7"],"iso":["A.5.23","A.5.9"]},{"id":"CLD-6","fn":"CLD","t":"Service Level Agreements (SLAs)","tAr":"اتفاقيات مستوى الخدمة (SLA)","r":"Contracts MUST define Service Level Agreements (SLAs) for availability. The agreement SHOULD include financial remedies (service credits) for failure to meet these standards.","rAr":"يجب أن تحدد العقود اتفاقيات مستوى الخدمة الخاصة بالإتاحة، وينبغي أن تتضمن الاتفاقية تعويضات مالية في صورة أرصدة خدمة عند الإخفاق في بلوغ هذه المستويات.","p":null,"pAr":null,"ep":"Fix availability expectations and the remedy for missing them.","epAr":"تثبيت التوقعات بشأن الإتاحة وتحديد التعويض عند الإخلال بها.","ck":["Every cloud contract defines a service level agreement for availability.","The agreement includes financial remedies such as service credits.","Achieved availability is compared against the agreed level."],"ckAr":["يحدد كل عقد سحابي اتفاقية مستوى خدمة للإتاحة.","تتضمن الاتفاقية تعويضات مالية مثل أرصدة الخدمة.","تقارن الإتاحة المتحققة بالمستوى المتفق عليه."],"ph":3,"ef":"low","csf":["GV.SC-05","ID.AM-08"],"cis":["15.4"],"iso":["A.5.22","A.5.30"]},{"id":"CLD-7","fn":"CLD","t":"Shared Responsibility Matrix","tAr":"مصفوفة المسؤولية المشتركة","r":"Entities MUST document the cloud service model (IaaS, PaaS, or SaaS) and the resulting division of security responsibilities. The Entity retains accountability for Data Classification, Identity & Access Management (IAM), and Resource Configuration, regardless of the model.","rAr":"يجب على الجهات توثيق نموذج الخدمة السحابية سواء كان بنية تحتية كخدمة أو منصة كخدمة أو برمجية كخدمة، وتوثيق ما يترتب عليه من توزيع للمسؤوليات الأمنية، وتظل الجهة مسؤولة عن تصنيف البيانات وإدارة الهوية والوصول وتهيئة الموارد أيا كان النموذج.","p":null,"pAr":null,"ep":"Remove ambiguity about which party secures which layer.","epAr":"إزالة الغموض بشأن الطرف المسؤول عن تأمين كل طبقة.","ck":["The cloud service model is documented for each service as IaaS, PaaS or SaaS.","The resulting division of security responsibilities is documented.","The entity accepts accountability for data classification regardless of model.","The entity accepts accountability for identity and access management regardless of model.","The entity accepts accountability for resource configuration regardless of model."],"ckAr":["نموذج الخدمة السحابية موثق لكل خدمة بوصفه بنية تحتية أو منصة أو برمجية كخدمة.","توزيع المسؤوليات الأمنية المترتب على ذلك موثق.","تقر الجهة بمسؤوليتها عن تصنيف البيانات أيا كان النموذج.","تقر الجهة بمسؤوليتها عن إدارة الهوية والوصول أيا كان النموذج.","تقر الجهة بمسؤوليتها عن تهيئة الموارد أيا كان النموذج."],"ph":1,"ef":"medium","csf":["GV.SC-04","GV.RR-02"],"cis":["15.2"],"iso":["A.5.23"]},{"id":"CLD-8","fn":"CLD","t":"Cloud Asset Inventory","tAr":"حصر الأصول السحابية","r":"Maintain a real-time inventory of cloud resources. Use programmatic resource tagging to identify the Data Classification (Public, Restricted, Sensitive) and Business Owner of each resource.","rAr":"تحفظ الجهة حصرا آنيا لموارد السحابة، وتستخدم الوسم البرمجي للموارد لتحديد تصنيف البيانات لكل مورد بوصفه عاما أو مقيدا أو حساسا وتحديد مالكه من جهة الأعمال.","p":null,"pAr":null,"ep":"Keep a live view of cloud resources and what they hold.","epAr":"الاحتفاظ برؤية آنية للموارد السحابية ولما تحتويه.","ck":["A real time inventory of cloud resources is maintained.","Programmatic resource tagging is in use.","Tags identify the data classification of each resource as Public, Restricted or Sensitive.","Tags identify the business owner of each resource."],"ckAr":["يحفظ حصر آني لموارد السحابة.","الوسم البرمجي للموارد مستخدم.","تبين الوسوم تصنيف بيانات كل مورد بوصفه عاما أو مقيدا أو حساسا.","تبين الوسوم مالك المورد من جهة الأعمال."],"ph":2,"ef":"medium","csf":["ID.AM-01","ID.AM-07"],"cis":["1.1","3.1"],"iso":["A.5.9"]},{"id":"CLD-9","fn":"CLD","t":"MFA for Cloud Consoles","tAr":"المصادقة متعددة العوامل للوحات التحكم السحابية","r":"Multi-Factor Authentication (MFA) MUST be enforced for all users with administrative access to the Cloud Management Console and root accounts.","rAr":"يجب فرض المصادقة متعددة العوامل على جميع المستخدمين ذوي الوصول الإداري إلى لوحة الإدارة السحابية وعلى الحسابات الجذرية.","p":null,"pAr":null,"ep":"Protect the highest value credentials in the environment.","epAr":"حماية أثمن بيانات الاعتماد في البيئة.","ck":["MFA is enforced for every user with administrative access to the cloud management console.","MFA is enforced on root accounts.","Enforcement is technical rather than advisory."],"ckAr":["المصادقة متعددة العوامل مفروضة على كل مستخدم له وصول إداري إلى لوحة الإدارة السحابية.","المصادقة متعددة العوامل مفروضة على الحسابات الجذرية.","الفرض تقني لا توجيهي."],"ph":1,"ef":"low","csf":["PR.AA-03","PR.AA-05"],"cis":["6.5","5.4"],"iso":["A.8.5"]},{"id":"CLD-10","fn":"CLD","t":"Service Account Hygiene","tAr":"سلامة حسابات الخدمة","r":"Service Accounts (non-human identities) MUST NOT be used for interactive human login. Keys for service accounts SHOULD be rotated periodically based on risk, or managed via automated identity federation (e.g., OIDC) to prevent credential theft.","rAr":"لا يجوز استخدام حسابات الخدمة، أي الهويات غير البشرية، في الدخول التفاعلي البشري، وينبغي تدوير مفاتيح حسابات الخدمة دوريا بناء على المخاطر أو إدارتها عبر اتحاد هوية آلي مثل OIDC منعا لسرقة بيانات الاعتماد.","p":null,"pAr":null,"ep":"Prevent credential theft through long lived non human identities.","epAr":"منع سرقة بيانات الاعتماد عبر الهويات غير البشرية طويلة الأمد.","ck":["Service accounts are not used for interactive human login.","Service account keys are rotated periodically based on risk, or federation removes the need for static keys.","Automated identity federation such as OIDC is used where available."],"ckAr":["لا تستخدم حسابات الخدمة للدخول التفاعلي البشري.","تجدد مفاتيح حسابات الخدمة دوريا بحسب المخاطر أو يستعاض عنها باتحاد الهوية بدل المفاتيح الثابتة.","يستخدم اتحاد الهوية الآلي مثل OIDC حيثما توفر."],"ph":2,"ef":"medium","csf":["PR.AA-01","PR.AA-05"],"cis":["5.2","5.4","5.6"],"iso":["A.5.16","A.5.17"]},{"id":"CLD-11","fn":"CLD","t":"Encryption by Default","tAr":"التشفير الافتراضي","r":"All data at rest in the cloud MUST be encrypted. Entities SHOULD utilize the CSP’s default encryption (platform-managed keys) as a minimum standard. For Sensitive data, Entities MAY opt for Customer-Managed Encryption Keys (CMEK) on cloud, based on a risk assessment. In accordance with Decision (1) of 2025.","rAr":"يجب تشفير جميع البيانات المحفوظة في السحابة، وينبغي أن تستخدم الجهات التشفير الافتراضي لدى مزود الخدمة السحابية أي المفاتيح المدارة من المنصة بوصفه حدا أدنى، أما البيانات الحساسة فيجوز أن تختار الجهات لها مفاتيح تشفير يديرها العميل في السحابة بناء على تقييم للمخاطر، وذلك وفقا للقرار رقم 1 لسنة 2025.","p":null,"pAr":null,"ep":"Ensure stored data is unreadable without the key.","epAr":"ضمان عدم إمكانية قراءة البيانات المخزنة دون المفتاح.","ck":["All data at rest in the cloud is encrypted.","Platform managed keys are used at minimum.","Use of customer managed encryption keys for Sensitive data is decided on a risk assessment.","The approach aligns with Decision No. 1 of 2025."],"ckAr":["كل البيانات المحفوظة في السحابة مشفرة.","المفاتيح المدارة من المنصة مستخدمة كحد أدنى.","استخدام مفاتيح تشفير يديرها العميل للبيانات الحساسة يقرر بناء على تقييم للمخاطر.","النهج متوائم مع القرار رقم 1 لسنة 2025."],"ph":1,"ef":"low","csf":["PR.DS-01","PR.DS-02"],"cis":["3.11","3.6"],"iso":["A.8.24"]},{"id":"CLD-12","fn":"CLD","t":"Data Residency (Customer Content)","tAr":"توطين البيانات (محتوى العميل)","r":"The Entity MUST configure cloud services and related contracts to store and process Customer Content (files, databases, application data) according to the National Data Classification Framework (Decision No. 1 of 2025).","rAr":"يجب على الجهة تهيئة الخدمات السحابية والعقود المرتبطة بها لحفظ محتوى العميل، أي الملفات وقواعد البيانات وبيانات التطبيقات، ومعالجته وفقا للإطار الوطني لتصنيف البيانات الصادر بالقرار رقم 1 لسنة 2025.","p":null,"pAr":null,"ep":"Keep Customer Content where the national framework requires it.","epAr":"إبقاء محتوى العميل داخل النطاق الجغرافي الذي يفرضه الإطار الوطني.","ck":["Cloud services are configured to store Customer Content in line with the National Data Classification Framework.","Cloud services are configured to process Customer Content in line with that framework.","Related contracts carry the same residency commitment.","Customer Content is understood to mean files, databases and application data."],"ckAr":["الخدمات السحابية مهيأة لحفظ محتوى العميل بما يتفق مع الإطار الوطني لتصنيف البيانات.","الخدمات السحابية مهيأة لمعالجة محتوى العميل بما يتفق مع ذلك الإطار.","تحمل العقود ذات الصلة الالتزام نفسه بتوطين البيانات.","محتوى العميل مفهوم بأنه الملفات وقواعد البيانات وبيانات التطبيقات."],"ph":1,"ef":"medium","csf":["GV.OC-03","PR.DS-01"],"cis":["3.1","3.12"],"iso":["A.5.12","A.5.34"]},{"id":"CLD-13","fn":"CLD","t":"Operational Metadata Exemption","tAr":"استثناء البيانات الوصفية التشغيلية","r":"Residency requirements apply to Customer Content. Operational Metadata (e.g., project IDs, billing logs, system status, and IP addresses) can be processed globally to ensure platform security, reliability, and accurate billing. Entities must ensure that metadata identifiers (such as Project IDs, folder names and labels) remain non-sensitive.","rAr":"تسري متطلبات توطين البيانات على محتوى العميل، أما البيانات الوصفية التشغيلية مثل معرفات المشاريع وسجلات الفوترة وحالة الأنظمة وعناوين بروتوكول الإنترنت فيمكن معالجتها عالميا ضمانا لأمن المنصة وموثوقيتها ودقة الفوترة، وعلى الجهات التأكد من بقاء معرفات البيانات الوصفية مثل معرفات المشاريع وأسماء المجلدات والوسوم غير حساسة.","p":null,"pAr":null,"ep":"Keep the residency rule workable by keeping metadata non sensitive.","epAr":"إبقاء قاعدة التوطين قابلة للتطبيق بجعل البيانات الوصفية غير حساسة.","ck":["The entity distinguishes Customer Content from Operational Metadata in its records.","Project identifiers remain non sensitive.","Folder names remain non sensitive.","Labels remain non sensitive.","Naming guidance is issued so metadata does not leak sensitive information."],"ckAr":["تميز الجهة محتوى العميل عن البيانات الوصفية التشغيلية في سجلاتها.","معرفات المشاريع تبقى غير حساسة.","أسماء المجلدات تبقى غير حساسة.","تبقى الوسوم غير حساسة.","تصدر إرشادات للتسمية حتى لا تسرب البيانات الوصفية معلومات حساسة."],"ph":2,"ef":"low","csf":["PR.DS-01","ID.AM-07"],"cis":["3.1"],"iso":["A.5.12"]},{"id":"CLD-14","fn":"CLD","t":"Public Access Prevention","tAr":"منع الوصول العام","r":"Cloud storage resources (e.g., object storage buckets) MUST be configured to block public access by default. Public exposure MUST be an explicit, documented exception approved by the data owner.","rAr":"يجب تهيئة موارد التخزين السحابي مثل حاويات تخزين الكائنات لحجب الوصول العام افتراضيا، ويجب أن يكون أي كشف للعموم استثناء صريحا وموثقا ومعتمدا من مالك البيانات.","p":null,"pAr":null,"ep":"Close the single most common cause of cloud data exposure.","epAr":"سد أكثر أسباب انكشاف البيانات السحابية شيوعا.","ck":["Cloud storage resources block public access by default.","The default applies at the organization or account level, not only per resource.","Any public exposure exists as an explicit documented exception.","Each exception is approved by the data owner."],"ckAr":["تحجب موارد التخزين السحابي الوصول العام افتراضيا.","الإعداد الافتراضي مطبق على مستوى المؤسسة أو الحساب لا على مستوى المورد وحده.","أي كشف للعموم قائم بوصفه استثناء صريحا وموثقا.","كل استثناء معتمد من مالك البيانات."],"ph":1,"ef":"low","csf":["PR.AA-05","PR.DS-01"],"cis":["3.3","4.1"],"iso":["A.5.15","A.8.3"]},{"id":"CLD-15","fn":"CLD","t":"Cloud Audit Logging","tAr":"تسجيل الأحداث السحابية","r":"Enable audit logging for cloud projects. Logs MUST capture \"Admin Activity\" (configuration changes) and \"Data Access\" (who accessed data) for sensitive workloads. Retain logs for a minimum of 12 months.","rAr":"تفعل الجهة تسجيل التدقيق لمشاريع السحابة، ويجب أن تلتقط السجلات النشاط الإداري أي تغييرات التهيئة والوصول إلى البيانات أي من اطلع عليها بالنسبة لأحمال العمل الحساسة، وتحفظ السجلات اثني عشر شهرا كحد أدنى.","p":null,"pAr":null,"ep":"Record who changed the environment and who reached the data.","epAr":"تسجيل من أجرى تغييرا على البيئة ومن اطلع على البيانات.","ck":["Audit logging is enabled for cloud projects.","Logs capture admin activity covering configuration changes.","Logs capture data access for sensitive workloads.","Cloud logs are retained for a minimum of 12 months."],"ckAr":["تسجيل التدقيق مفعل لمشاريع السحابة.","تلتقط السجلات النشاط الإداري شاملا تغييرات التهيئة.","تلتقط السجلات الوصول إلى البيانات في أحمال العمل الحساسة.","تحفظ سجلات السحابة اثني عشر شهرا كحد أدنى."],"ph":2,"ef":"medium","csf":["DE.CM-01","DE.CM-03"],"cis":["8.2","8.5","8.10"],"iso":["A.8.15"]},{"id":"CLD-16","fn":"CLD","t":"Secure Connectivity","tAr":"الاتصال الآمن","r":"All traffic between the entity and the cloud provider MUST be encrypted in transit using industry-standard protocols (e.g., TLS 1.2 or higher). Management interfaces MUST NOT be exposed directly to the public internet; use secure bastions, VPNs, or Identity-Aware Proxies.","rAr":"يجب تشفير كل حركة البيانات بين الجهة ومزود الخدمة السحابية أثناء النقل باستخدام بروتوكولات قياسية في الصناعة مثل TLS 1.2 فأعلى، ولا يجوز كشف واجهات الإدارة مباشرة على الإنترنت العام، بل تستخدم مضيفات وسيطة آمنة أو شبكات خاصة افتراضية أو وكلاء واعين بالهوية.","p":null,"pAr":null,"ep":"Protect traffic in transit and keep manageme let lang="en",domain="*",fnFilter="*",sel=null;
const t=()=>T[lang];
const L=()=>lang==="ar";
const el=i=>document.getElementById(i);
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FN=Object.fromEntries(C.fn.map(f=>[f.id,f]));

function toggle(){
  lang=lang==="en"?"ar":"en";
  document.documentElement.lang=lang;
  document.documentElement.dir=L()?"rtl":"ltr";
  paint();render();
}

function paint(){
  const s=t();
  document.title=s.nm+" | "+s.tg;
  el("nm").textContent=s.nm;el("tg").textContent=s.tg;el("lang").textContent=s.btn;
  el("lede").textContent=s.lede;
  el("figs").innerHTML=s.figs.map(f=>'<div class="fig"><b dir="ltr">'+f[0]+'</b><span>'+f[1]+'</span></div>').join("");

  [["h-ex","hEx"],["a-ex","aEx"],["s-ex","sEx"],["h-xw","hXw"],["a-xw","aXw"],["s-xw","sXw"],
   ["h-ds","hDs"],["a-ds","aDs"],["h-pub","hPub"],["a-pub","aPub"],["h-idx","hIdx"],
   ["h-mir","hMir"],["p-mir","mir"],["h-rev","hRev"],["s-rev","sRev"],
   ["f1","f1"],["f2","f2"],["f3","f3"]]
   .forEach(([id,k])=>el(id).textContent=s[k]);
  el("e-idx").textContent=DATA.stats.projects;
  el("q").placeholder=s.q;el("cmd").placeholder=s.cmd;paintScope();

  paintExplorer();paintXwalk();paintSets();paintPubs();paintTabs();paintReview();
  el("mir").innerHTML=DATA.mirrors.map(m=>'<a href="'+m.url+'" target="_blank" rel="noopener" dir="ltr">'+m.name+'</a>').join("");
}

function counts(){
  const c={};C.controls.forEach(x=>c[x.fn]=(c[x.fn]||0)+1);return c;
}

function paintExplorer(){
  const s=t(),cn=counts(),tot=C.controls.length;
  el("dist").innerHTML=C.fn.map(f=>{
    const n=cn[f.id]||0;
    return '<button class="seg'+(fnFilter!=="*"&&fnFilter!==f.id?" off":"")+'" style="flex:'+n+
      ';background:'+f.color+'" onclick="setFn(\''+f.id+'\')" title="'+esc(L()?f.nameAr:f.name)+'">'+
      (n>1?'<b dir="ltr">'+n+'</b>':"")+'</button>';
  }).join("");
  el("legend").innerHTML='<button class="lg'+(fnFilter==="*"?" on":"")+'" onclick="setFn(\'*\')">'+
    s.all+'<u dir="ltr">'+tot+'</u></button>'+
    C.fn.map(f=>'<button class="lg'+(fnFilter===f.id?" on":"")+'" onclick="setFn(\''+f.id+'\')">'+
      '<span class="dot" style="background:'+f.color+'"></span>'+esc(L()?f.nameAr:f.name)+
      '<u dir="ltr">'+(cn[f.id]||0)+'</u></button>').join("");

  const list=C.controls.filter(c=>fnFilter==="*"||c.fn===fnFilter);
  el("ctrls").innerHTML=list.map(c=>
    '<button class="ct'+(sel===c.id?" sel":"")+'" style="border-inline-start-color:'+FN[c.fn].color+
    '" onclick="setCtl(\''+c.id+'\')"><b dir="ltr">'+esc(c.id)+'</b><span>'+
    esc(L()?c.tAr:c.t)+'</span></button>').join("");
  paintDetail();
}

function paintDetail(){
  const s=t();
  if(!sel){el("det").innerHTML='<p class="hint">'+s.pick+'</p>';return;}
  const c=C.controls.find(x=>x.id===sel),f=FN[c.fn];
  const official=!!c.p, purpose=official?(L()?c.pAr:c.p):(L()?c.epAr:c.ep);
  const checks=L()?c.ckAr:c.ck;
  const maps=[].concat(
    c.csf.map(m=>'<span class="map csf" dir="ltr">CSF '+esc(m)+'</span>'),
    c.cis.map(m=>'<span class="map cis" dir="ltr">CIS '+esc(m)+'</span>'),
    c.iso.map(m=>'<span class="map iso" dir="ltr">ISO '+esc(m)+'</span>'));
  el("det").innerHTML=
    '<div class="det-h"><b dir="ltr">'+esc(c.id)+'</b><h3>'+esc(L()?c.tAr:c.t)+'</h3>'+
      '<span class="pill fnp" style="background:'+f.color+'">'+esc(L()?f.nameAr:f.name)+'</span>'+
      '<span class="pill" style="color:var(--faint);border-color:var(--rule-hi)">'+
        s.phase+' '+c.ph+' &middot; '+s.effort+' '+esc(c.ef)+'</span></div>'+
    (purpose?'<div class="lbl">'+s.purpose+' <span class="pill '+(official?"off":"edi")+'">'+
      (official?s.offP:s.ediP)+'</span></div><p>'+esc(purpose)+'</p>':"")+
    '<div class="lbl">'+s.req+'</div><div class="quote">'+esc(L()?c.rAr:c.r)+'</div>'+
    (checks&&checks.length?'<div class="lbl">'+s.checks+' <span style="color:var(--faint)" dir="ltr">'+
      checks.length+'</span></div><ul class="checks">'+
      checks.map(k=>'<li>'+esc(k)+'</li>').join("")+'</ul>':"")+
    (maps.length?'<div class="lbl">'+s.maps+'</div><div class="maps">'+maps.join("")+'</div>':"");
}

function setFn(id){fnFilter=(fnFilter===id)?"*":id;sel=null;paintExplorer();}
function setCtl(id){sel=(sel===id)?null:id;paintExplorer();
  if(sel)el("det").scrollIntoView({block:"nearest",behavior:"smooth"});}

  const s=t(),k=C.xw.counts;
  el("xw-l").innerHTML=
    '<div class="stat"><b dir="ltr">'+k.candidate_pairs+'</b><span>'+s.xwP+'</span></div>'+
    '<div class="stat"><b dir="ltr">'+C.xw.d+'</b><span>'+s.xwD+'</span></div>'+
    '<p style="color:var(--dim);font-size:12.8px">'+s.xwV+'</p>'+
    '<div class="warnbox">'+s.xwWarn+'</div>';
  const mx=Math.max(k.strong,k.moderate,k.weak);
  const bar=(lab,n,col)=>'<div class="bar"><i>'+lab+'</i><div class="track">'+
    '<div class="fill" style="width:'+(n/mx*100)+'%;background:'+col+'"></div></div>'+
    '<s dir="ltr">'+n+'</s></div>';
  el("xw-r").innerHTML='<div class="bars">'+
    bar(s.xwS,k.strong,"var(--go)")+bar(s.xwM,k.moderate,"var(--blue)")+bar(s.xwW,k.weak,"var(--faint)")+
    '</div><div class="lbl">'+s.xwTop+'</div><div class="bars">'+
    C.xw.top.slice(0,8).map(p=>'<div class="bar"><i dir="ltr">'+esc(p.n)+'</i>'+
      '<div class="track"><div class="fill" style="width:'+(p.s/0.4*100)+'%;background:var(--go)"></div></div>'+
      '<s dir="ltr">'+esc(p.c)+'</s></div>').join("")+'</div>';
}

function paintSets(){
  const s=t();
  el("dsets").innerHTML=SETS.map(d=>'<div class="dset">'+
    '<div><b dir="ltr">'+d.n+'</b><u>'+s.records+'</u></div>'+
    '<h4>'+(L()?d.ar:d.en)+'</h4><p>'+(L()?d.arD:d.enD)+'</p>'+
    '<div class="dl">'+d.fmt.map(f=>'<a href="corpus/'+d.id+'/'+d.file+'.'+f.toLowerCase()+
      '" dir="ltr">'+f+'</a>').join("")+
    '<a href="https://github.com/SiteQ8/Markaz/tree/main/corpus/'+d.id+'" dir="ltr">docs</a></div></div>').join("");
}

function paintPubs(){
  el("pub").innerHTML=PUBS.map(p=>'<a class="row" href="publications/'+p.dir+'/" target="_blank" rel="noopener">'+
    '<div class="r-top"><span class="r-id" dir="ltr">'+p.no+'</span><span class="r-ttl">'+
    (L()?p.ar:p.en)+'</span><span class="r-meta"><s dir="ltr">'+p.date+'</s></span></div>'+
    '<div class="r-desc">'+(L()?p.arD:p.enD)+'</div></a>').join("");
}

function paintTabs(){
  const s=t(),c={};
  DATA.projects.forEach(p=>c[p.domain]=(c[p.domain]||0)+1);
  el("tabs").innerHTML='<button class="tab '+(domain==="*"?"on":"")+'" onclick="pick(\'*\')">'+
    s.all+'<u>'+DATA.stats.projects+'</u></button>'+
    DATA.domains.map(d=>'<button class="tab '+(domain===d.id?"on":"")+'" onclick="pick(\''+d.id+'\')">'+
      (L()?d.ar:d.en)+'<u>'+(c[d.id]||0)+'</u></button>').join("");
}

function pick(d){domain=d;paintTabs();render();}

function render(){
  const s=t(),term=el("q").value.trim().toLowerCase();
  const hits=DATA.projects.filter(p=>{
    if(domain!=="*"&&p.domain!==domain)return false;
    if(!term)return true;
    return (p.name+" "+p.description+" "+p.ar+" "+p.language+" "+p.topics.join(" ")).toLowerCase().indexOf(term)>-1;
  });
  if(!hits.length){el("out").innerHTML='<p class="none">'+s.none+'</p>';return;}
  el("out").innerHTML=DATA.domains.filter(d=>hits.some(p=>p.domain===d.id)).map(d=>{
    const rs=hits.filter(p=>p.domain===d.id).sort((a,b)=>b.stars-a.stars||b.size_kb-a.size_kb);
    return '<section class="grp"><div class="grp-h"><span>'+(L()?d.ar:d.en)+'</span><em>'+rs.length+
      '</em></div><div class="rows">'+rs.map(row).join("")+'</div></section>';
  }).join("");
}

function row(p){
  const s=t(),m=[];
  if(p.language)m.push('<s dir="ltr">'+esc(p.language)+'</s>');
  if(p.stars)m.push('<s class="st" dir="ltr">'+p.stars+'</s>');
  m.push((p.license&&p.license!=="NOASSERTION")?'<s dir="ltr">'+esc(p.license)+'</s>'
    :'<s class="nl">'+s.nolic+'</s>');
  if(p.pages)m.push('<s class="op">'+s.open+'</s>');
  return '<a class="row" href="'+(p.pages||p.url)+'" target="_blank" rel="noopener">'+
    '<div class="r-top"><span class="r-id" dir="ltr">'+esc(p.name)+'</span>'+
    '<span class="r-meta">'+m.join("")+'</span></div><div class="r-desc">'+
    esc(L()?(p.ar||""):(p.description||""))+'</div></a>';
}


/* ---- Lazy corpora. The page paints from embedded data, then pulls the larger
   corpora in the background so search can reach all 1,133 records. ---- */
let CORF=null, XW=null;
async function lazy(){
  const grab=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null;}catch(e){return null;}};
  const got=await Promise.all([grab("data/corf-lite.json"),grab("data/xwalk-lite.json")]);
  CORF=got[0];XW=got[1];
  paintScope();paintReview();if(el("cmd").value.trim())doSearch();
}
function paintScope(){
  const s=t(),n=44+(CORF?CORF.n:0)+(XW?XW.p.length:0);
  el("cmd-s").textContent=n.toLocaleString(L()?"ar-EG":"en")+" "+s.records;
}

/* ---- Deep links: every control is citable. ---- */
function readHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(h.indexOf("c/")===0){
    const id=h.slice(2);
    if(C.controls.some(x=>x.id===id)){sel=id;fnFilter="*";paintExplorer();
      setTimeout(function(){el("det").scrollIntoView({block:"center"});},60);}
  } else if(h.indexOf("q/")===0){el("cmd").value=h.slice(2);doSearch();}
}
function setHash(h){
  if(location.hash!=="#"+h)history.replaceState(null,"",h?"#"+h:location.pathname);
}
addEventListener("hashchange",readHash);

/* ---- Global search across every corpus. ---- */
function hl(txt,term){
  txt=txt||"";
  const i=txt.toLowerCase().indexOf(term);
  if(i<0)return esc(txt.slice(0,150));
  const a=Math.max(0,i-55),b=Math.min(txt.length,i+term.length+95);
  return (a>0?"&hellip;":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+term.length))+
         "</mark>"+esc(txt.slice(i+term.length,b))+(b<txt.length?"&hellip;":"");
}
function doSearch(){
  const s=t(),raw=el("cmd").value.trim(),term=raw.toLowerCase();
  setHash(raw?"q/"+raw:"");
  if(term.length<2){el("res").innerHTML="";return;}
  const G=[];

  const ctl=[];
  C.controls.forEach(function(c){
    const fields=[c.id,c.t,c.tAr,c.r,c.rAr,c.p||"",c.pAr||"",c.ep||"",c.epAr||""];
    const inChecks=(c.ck||[]).concat(c.ckAr||[]).filter(function(k){return k.toLowerCase().indexOf(term)>-1;});
    const hitField=fields.filter(function(f){return f&&f.toLowerCase().indexOf(term)>-1;})[0];
    if(hitField||inChecks.length){
      ctl.push('<button class="hit" onclick="goCtl(\''+c.id+'\')">'+
        '<b dir="ltr">'+esc(c.id)+'</b><span>'+esc(L()?c.tAr:c.t)+'</span><em>'+
        hl(inChecks[0]||(L()?c.rAr:c.r),term)+'</em></button>');
    }
  });
  if(ctl.length)G.push([s.gCtl,ctl]);

  if(CORF){
    const h=[];
    for(let i=0;i<CORF.c.length&&h.length<25;i++){
      const c=CORF.c[i];
      if(c.t.toLowerCase().indexOf(term)>-1||c.k.toLowerCase().indexOf(term)>-1){
        h.push('<a class="hit" href="corpus/kw-corf/controls.json" target="_blank" rel="noopener">'+
          '<b dir="ltr">'+esc(c.k)+'</b><span>'+esc(c.d||"")+'</span>'+
          '<em dir="ltr" style="text-align:start">'+hl(c.t,term)+'</em></a>');
      }
    }
    if(h.length)G.push([s.gCorf,h]);
  }

  if(XW){
    const h=XW.p.filter(function(p){
      return (p.n+" "+p.nt+" "+p.c+" "+p.tx).toLowerCase().indexOf(term)>-1;
    }).slice(0,15).map(function(p){
      return '<a class="hit" href="corpus/kw-crosswalk/nbcc-corf.json" target="_blank" rel="noopener">'+
        '<b dir="ltr">'+esc(p.n)+' &rarr; '+esc(p.c)+'</b>'+
        '<span class="conf '+p.cf+'">'+s.cf[p.cf]+'</span><em>'+hl(p.tx,term)+'</em></a>';
    });
    if(h.length)G.push([s.gXw,h]);
  }

  const prj=DATA.projects.filter(function(p){
    return (p.name+" "+p.description+" "+p.ar+" "+p.topics.join(" ")).toLowerCase().indexOf(term)>-1;
  }).slice(0,12).map(function(p){
    return '<a class="hit" href="'+(p.pages||p.url)+'" target="_blank" rel="noopener">'+
      '<b dir="ltr">'+esc(p.name)+'</b><em>'+hl(L()?(p.ar||""):(p.description||""),term)+'</em></a>';
  });
  if(prj.length)G.push([s.gPrj,prj]);

  el("res").innerHTML=G.length
    ? '<div class="res">'+G.map(function(g){
        return '<div class="res-g"><div class="res-h">'+g[0]+'<u dir="ltr">'+g[1].length+
          '</u></div>'+g[1].join("")+'</div>';}).join("")+'</div>'+
      (!CORF?'<div class="loading">'+s.loading+'</div>':"")
    : '<div class="res"><div class="loading">'+s.noHit+'</div></div>';
}
function goCtl(id){
  sel=id;fnFilter="*";paintExplorer();setHash("c/"+id);
  el("det").scrollIntoView({block:"center",behavior:"smooth"});
}

/* ---- Review tool. Decisions stay in memory and leave as a file, because a
   confirmation with no named reviewer is worth no more than the proposal. ---- */
const AR_TITLE={};C.controls.forEach(function(c){AR_TITLE[c.id]=c.tAr;});
const REV={};
let revWho="",revFilter="strong";
function setWho(v){revWho=v.trim();paintReview();}
function setRevFilter(v){revFilter=v;paintReview();}
function decide(key,verdict){
  const n=el("note-"+key);
  REV[key]={verdict:verdict,note:n?n.value.trim():"",by:revWho};
  paintReview();
}
function undo(key){delete REV[key];paintReview();}
function exportRev(){
  const rows=Object.keys(REV).map(function(k){
    const p=XW.p.filter(function(x){return x.n+"|"+x.c===k;})[0];
    return {nbcc:p.n,corf:p.c,score:p.s,confidence:p.cf,
      status:REV[k].verdict==="ok"?"confirmed":"rejected",
      decision:REV[k].verdict==="ok"?"equivalent":"not equivalent",
      reviewed_by:REV[k].by,note:REV[k].note};
  });
  const blob=new Blob([JSON.stringify({reviewed:rows.length,reviewer:revWho,pairs:rows},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="crosswalk-review.json";a.click();
  URL.revokeObjectURL(a.href);
}
function paintReview(){
  const s=t();
  if(!XW){el("rev-bar").innerHTML='<span class="loading">'+s.loading+'</span>';el("rev").innerHTML="";return;}
  const done=Object.keys(REV).length;
  el("rev-bar").innerHTML=
    '<b dir="ltr">'+done+' / '+XW.p.length+'</b>'+
    '<input class="who" id="who" value="'+esc(revWho)+'" oninput="setWho(this.value)" placeholder="'+s.who+'">'+
    ["strong","moderate","weak"].map(function(k){
      return '<button class="btn'+(revFilter===k?" pri":"")+'" onclick="setRevFilter(\''+k+'\')">'+
        s.cf[k]+' <span dir="ltr">'+XW.n[k]+'</span></button>';}).join("")+
    '<button class="btn" onclick="exportRev()"'+(done&&revWho?"":" disabled")+'>'+s.exp+'</button>';

  el("rev").innerHTML=XW.p.filter(function(p){return p.cf===revFilter;}).slice(0,40).map(function(p){
    const key=p.n+"|"+p.c,r=REV[key];
    return '<div class="pair'+(r?" done":"")+'">'+
      '<div class="pair-h"><b dir="ltr">'+esc(p.n)+'</b><i>'+
      esc(L()?(AR_TITLE[p.n]||p.nt):p.nt)+'</i>'+
      '<span class="conf '+p.cf+'">'+esc(p.dm||"")+'</span>'+
      '<s dir="ltr">'+esc(p.c)+' &middot; '+p.s+'</s></div>'+
      (L()?'<div style="font-size:11px;color:var(--faint);margin-bottom:4px">'+s.srcEn+'</div>':"")+
      '<p dir="ltr" style="text-align:start">'+esc(p.tx)+'</p>'+
      (r?'<div class="pair-a"><span class="verdict '+r.verdict+'">'+(r.verdict==="ok"?s.vOk:s.vNo)+'</span>'+
          (r.note?'<span style="font-size:12.3px;color:var(--faint)">'+esc(r.note)+'</span>':"")+
          '<button class="btn" onclick="undo(\''+key+'\')">'+s.undo+'</button></div>'
        :'<div class="pair-a"><input class="note" id="note-'+key+'" placeholder="'+s.why+'">'+
          '<button class="btn pri" onclick="decide(\''+key+'\',\'ok\')"'+(revWho?"":" disabled")+'>'+s.ok+'</button>'+
          '<button class="btn" onclick="decide(\''+key+'\',\'no\')"'+(revWho?"":" disabled")+'>'+s.no+'</button></div>')+
      '</div>';
  }).join("");
}

paint();render();readHash();lazy();
</script>
</body>
