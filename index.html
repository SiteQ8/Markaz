<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markaz | Kuwait Cybersecurity Research Centre</title>
<meta name="description" content="Open regulatory data for Kuwait and the Gulf. Browse the national baseline, its crosswalks and the tooling built against it.">
<style>
:root{
  --bg:#07080b; --panel:#0e1116; --panel2:#12161c; --raise:#171c23;
  --rule:#1d232b; --rule-hi:#2b333d;
  --ink:#eaeef2; --dim:#98a3ad; --faint:#5f6b76;
  --go:#14c88a; --amber:#e0a32e; --blue:#4a9edb; --red:#d14b3f;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --ar:"SF Arabic","Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --lift:inset 0 1px 0 rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:
    radial-gradient(1100px 460px at 50% -8%,rgba(20,200,138,.075),transparent 70%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  letter-spacing:-0.005em;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[dir="rtl"] body{font-family:var(--ar);line-height:1.85;letter-spacing:normal}
a{color:inherit}
button{font-family:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 22px}

/* Masthead */
.top{border-bottom:1px solid var(--rule);background:rgba(7,8,11,.9);
     backdrop-filter:blur(10px);position:sticky;top:0;z-index:60}
.top-in{display:flex;align-items:center;gap:13px;padding:12px 0}
.sig{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
     background:linear-gradient(150deg,var(--go),#068257);color:#02170f;
     font-family:var(--ar);font-size:17px;font-weight:700;box-shadow:var(--lift)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-0.015em;line-height:1.25}
html[dir="rtl"] .nm b{letter-spacing:normal}
.nm span{display:block;font-size:11.5px;color:var(--faint);line-height:1.35}
.lang{background:transparent;border:1px solid var(--rule-hi);color:var(--dim);
      padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.lang:hover{border-color:var(--go);color:var(--go)}

/* Opening figures */
.head{padding:34px 0 28px}
.head>p{max-width:62ch;color:var(--dim);font-size:15.5px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
      border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:24px}
.fig{background:linear-gradient(165deg,var(--panel2),var(--panel));padding:17px 18px;box-shadow:var(--lift)}
.fig b{display:block;font-family:var(--mono);font-size:30px;font-weight:660;
       letter-spacing:-0.04em;line-height:1.05;color:var(--go)}
.fig span{display:block;font-size:11px;color:var(--faint);margin-top:5px;
          letter-spacing:.08em;text-transform:uppercase}
html[dir="rtl"] .fig span{letter-spacing:normal;text-transform:none;font-size:12.5px}

/* Command bar: search across every corpus at once. */
.cmd{position:relative;margin-top:22px}
.cmd input{
  width:100%;background:linear-gradient(168deg,var(--panel2),var(--panel));
  border:1px solid var(--rule-hi);color:var(--ink);padding:13px 16px;
  border-radius:11px;font-size:15px;font-family:inherit;box-shadow:var(--lift);
}
.cmd input:focus{outline:none;border-color:var(--go)}
.cmd input::placeholder{color:var(--faint)}
.cmd-s{position:absolute;inset-inline-end:14px;top:14px;font-family:var(--mono);
       font-size:11px;color:var(--faint);pointer-events:none}
html[dir="rtl"] .cmd-s{font-family:var(--ar)}
.res{margin-top:11px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
     background:linear-gradient(168deg,var(--panel2),var(--panel));box-shadow:var(--lift)}
.res-g{border-bottom:1px solid var(--rule)}
.res-g:last-child{border-bottom:0}
.res-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
       padding:9px 15px 6px;font-weight:640;display:flex;gap:8px;align-items:baseline}
html[dir="rtl"] .res-h{letter-spacing:normal;text-transform:none;font-size:12px}
.res-h u{text-decoration:none;font-family:var(--mono);font-size:10.5px}
.hit{display:block;padding:9px 15px;border-top:1px solid var(--rule);cursor:pointer;
     text-decoration:none;color:inherit;text-align:start;background:none;border-inline:0;
     border-bottom:0;width:100%;font-family:inherit}
.hit:hover{background:var(--raise)}
.hit b{font-family:var(--mono);font-size:11.5px;color:var(--go);margin-inline-end:9px}
.hit span{font-size:13px;color:var(--ink)}
.hit em{font-style:normal;display:block;font-size:12.3px;color:var(--faint);
        line-height:1.5;margin-top:2px}
html[dir="rtl"] .hit em{line-height:1.7;font-size:13px}
.hit mark{background:rgba(20,200,138,.22);color:var(--go);border-radius:2px;padding:0 1px}
.loading{padding:11px 15px;font-size:12.5px;color:var(--faint)}

/* Review tool */
.rev{border-top:1px solid var(--rule)}
.rev-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:13px 16px;
         border-bottom:1px solid var(--rule)}
.rev-bar b{font-family:var(--mono);font-size:12px;color:var(--dim)}
.who{background:var(--raise);border:1px solid var(--rule-hi);color:var(--ink);
     padding:6px 11px;border-radius:7px;font-size:12.5px;font-family:inherit;min-width:170px}
.who:focus{outline:none;border-color:var(--go)}
.btn{background:var(--raise);border:1px solid var(--rule-hi);color:var(--dim);
     padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--go);color:var(--go)}
.btn.pri{background:var(--go);border-color:var(--go);color:#04120c;font-weight:650}
.btn.pri:hover{filter:brightness(1.1);color:#04120c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pair{padding:14px 16px;border-bottom:1px solid var(--rule)}
.pair:last-child{border-bottom:0}
.pair.done{opacity:.5}
.pair-h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pair-h b{font-family:var(--mono);font-size:12.5px;font-weight:660}
.pair-h i{font-style:normal;font-size:13px;color:var(--ink)}
.pair-h s{text-decoration:none;margin-inline-start:auto;font-family:var(--mono);
          font-size:11px;color:var(--faint)}
.conf{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid}
.conf.strong{color:var(--go);border-color:#0d5f43;background:#07231a}
.conf.moderate{color:var(--blue);border-color:#1d3f5c;background:#0a1c28}
.conf.weak{color:var(--faint);border-color:var(--rule-hi)}
html[dir="rtl"] .conf{font-family:var(--ar)}
.pair p{font-size:12.8px;color:var(--dim);line-height:1.55;
        border-inline-start:2px solid var(--rule-hi);padding-inline-start:11px}
html[dir="rtl"] .pair p{line-height:1.75;font-size:13.5px}
.pair-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.note{flex:1;min-width:180px;background:var(--raise);border:1px solid var(--rule);
      color:var(--ink);padding:6px 10px;border-radius:7px;font-size:12.5px;font-family:inherit}
.note:focus{outline:none;border-color:var(--go)}
.verdict{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px}
.verdict.ok{color:var(--go);background:#07231a;border:1px solid #0d5f43}
.verdict.no{color:var(--red);background:#241110;border:1px solid #5c2320}
html[dir="rtl"] .verdict{font-family:var(--ar)}

/* Section heading */
.sh{display:flex;align-items:baseline;gap:10px;padding:34px 0 12px}
.sh h2{font-size:18px;font-weight:660;letter-spacing:-0.02em}
html[dir="rtl"] .sh h2{letter-spacing:normal}
.sh em{font-style:normal;font-size:12.5px;color:var(--faint)}
.sh a{margin-inline-start:auto;font-size:12.5px;color:var(--go);text-decoration:none;white-space:nowrap}
.sh a:hover{text-decoration:underline}
.sub{color:var(--faint);font-size:13.5px;max-width:78ch;margin:-4px 0 16px}

/* Panel */
.panel{background:linear-gradient(168deg,var(--panel2),var(--panel));
       border:1px solid var(--rule);border-radius:13px;box-shadow:var(--lift);overflow:hidden}

/* Distribution bar */
.dist{display:flex;height:44px;width:100%}
.seg{border:0;padding:0;cursor:pointer;position:relative;transition:filter .12s;
     display:flex;align-items:center;justify-content:center;min-width:14px}
.seg:hover{filter:brightness(1.35)}
.seg b{font-family:var(--mono);font-size:12px;color:#04120c;font-weight:700}
.seg.off{filter:grayscale(.75) brightness(.5)}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:12px;border-top:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;
    border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--dim);font-size:12.5px}
.lg:hover{background:var(--raise);color:var(--ink)}
.lg.on{background:var(--raise);border-color:var(--rule-hi);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.lg u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* Control chips */
.ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
       gap:7px;padding:14px;border-top:1px solid var(--rule)}
.ct{background:var(--raise);border:1px solid var(--rule);border-inline-start:3px solid;
    border-radius:8px;padding:9px 11px;cursor:pointer;text-align:start;color:var(--ink)}
.ct:hover{border-color:var(--rule-hi);background:#1b212a}
.ct.sel{background:#1e2630;border-color:var(--go)}
.ct b{display:block;font-family:var(--mono);font-size:12px;font-weight:660;letter-spacing:-0.02em}
.ct span{display:block;font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:3px}
html[dir="rtl"] .ct span{line-height:1.65;font-size:12.5px}

/* Detail */
.det{border-top:1px solid var(--rule);padding:20px}
.det-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:4px}
.det-h b{font-family:var(--mono);font-size:15px;font-weight:660}
.det-h h3{font-size:17px;font-weight:650;letter-spacing:-0.015em}
html[dir="rtl"] .det-h h3{letter-spacing:normal}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.pill.fnp{color:#04120c;border-color:transparent;font-weight:700}
.pill.off{color:var(--go);border-color:#0d5f43;background:#07231a}
.pill.edi{color:var(--amber);border-color:#5c4415;background:#211809}
html[dir="rtl"] .pill{font-family:var(--ar)}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
     margin:15px 0 5px;font-weight:640}
html[dir="rtl"] .lbl{letter-spacing:normal;text-transform:none;font-size:12px}
.quote{border-inline-start:2px solid var(--rule-hi);padding-inline-start:14px;
       color:var(--ink);font-size:14px;line-height:1.62}
html[dir="rtl"] .quote{line-height:1.85}
.det p{color:var(--dim);font-size:13.8px}
.checks{list-style:none;counter-reset:c}
.checks li{counter-increment:c;position:relative;padding-inline-start:26px;
           color:var(--dim);font-size:13.3px;line-height:1.55;margin-bottom:5px}
html[dir="rtl"] .checks li{line-height:1.78;font-size:14px}
.checks li::before{content:counter(c,decimal-leading-zero);position:absolute;
  inset-inline-start:0;font-family:var(--mono);font-size:10.5px;color:var(--faint);top:2px}
.maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.map{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;
     border:1px solid var(--rule-hi);color:var(--dim)}
.map.csf{color:var(--blue);border-color:#1d3f5c}
.map.cis{color:var(--go);border-color:#0d5f43}
.map.iso{color:var(--faint)}
.hint{color:var(--faint);font-size:13px;padding:22px;text-align:center}

/* Crosswalk */
.xw{display:grid;grid-template-columns:250px 1fr;gap:1px;background:var(--rule)}
.xw>div{background:linear-gradient(168deg,var(--panel2),var(--panel));padding:18px}
.stat{margin-bottom:14px}
.stat b{display:block;font-family:var(--mono);font-size:23px;color:var(--go);
        font-weight:660;letter-spacing:-0.035em}
.stat span{font-size:11.5px;color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:12px}
.bar i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}
.track{height:7px;background:var(--raise);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.bar s{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint)}
.warnbox{margin-top:14px;padding:10px 12px;border-radius:8px;background:#211809;
         border:1px solid #5c4415;color:var(--amber);font-size:12.5px}

/* Datasets */
.dsets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.dset{background:linear-gradient(168deg,var(--panel2),var(--panel));border:1px solid var(--rule);
      border-radius:12px;padding:16px 17px;box-shadow:var(--lift);display:flex;flex-direction:column}
.dset b{font-family:var(--mono);font-size:26px;color:var(--go);font-weight:660;letter-spacing:-0.035em}
.dset u{text-decoration:none;font-size:11px;color:var(--faint);margin-inline-start:6px}
.dset h4{font-size:14px;font-weight:640;margin:7px 0 5px}
.dset p{color:var(--dim);font-size:12.8px;line-height:1.55;flex:1}
html[dir="rtl"] .dset p{line-height:1.78;font-size:13.5px}
.dl{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.dl a{font-family:var(--mono);font-size:10.5px;color:var(--go);text-decoration:none;
      border:1px solid #0d5f43;padding:2px 8px;border-radius:5px}
.dl a:hover{background:#07231a}

/* Rows */
.rows{border-top:1px solid var(--rule)}
.row{display:block;padding:13px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.row:hover{background:var(--panel)}
.r-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.r-id{font-family:var(--mono);font-size:13.5px;font-weight:650;letter-spacing:-0.02em;overflow-wrap:anywhere}
.row:hover .r-id{color:var(--go)}
.r-ttl{font-weight:620;font-size:14px}
.r-meta{margin-inline-start:auto;display:flex;gap:11px;font-family:var(--mono);
        font-size:10.5px;color:var(--faint);white-space:nowrap}
.r-meta s{text-decoration:none}
.r-meta .st{color:var(--amber)}
.r-meta .op{color:var(--go)}
html[dir="rtl"] .r-meta .op,html[dir="rtl"] .r-meta .nl{font-family:var(--ar);letter-spacing:normal}
.r-desc{color:var(--dim);font-size:13px;line-height:1.55;margin-top:3px;max-width:92ch}
html[dir="rtl"] .r-desc{line-height:1.78;font-size:13.8px}

/* Filter */
.bar2{position:sticky;top:59px;background:var(--bg);z-index:30;padding:10px 0 0}
.q{width:100%;background:var(--panel2);border:1px solid var(--rule-hi);color:var(--ink);
   padding:9px 13px;border-radius:8px;font-size:14px;font-family:inherit}
.q:focus{outline:none;border-color:var(--go)}
.q::placeholder{color:var(--faint)}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 4px}
.tab{background:transparent;border:1px solid transparent;color:var(--dim);padding:4px 9px;
     border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.on{background:var(--go);color:#04120c;font-weight:650}
.tab u{text-decoration:none;font-family:var(--mono);opacity:.6;margin-inline-start:5px;font-size:10.5px}
.grp{padding:16px 0 0}
.grp-h{font-size:12.5px;font-weight:650;color:var(--dim);padding-bottom:6px;
       border-bottom:1px solid var(--rule-hi);display:flex;gap:9px;align-items:baseline}
.grp-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-inline-start:auto}

.mir{padding:4px 0}
.mir p{color:var(--faint);font-size:12.5px;max-width:76ch;margin-bottom:10px}
.mir div{display:flex;flex-wrap:wrap;gap:5px}
.mir a{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-decoration:none;
       border:1px solid var(--rule);padding:2px 7px;border-radius:5px}
.mir a:hover{color:var(--dim);border-color:var(--rule-hi)}
.none{color:var(--faint);padding:24px 0;font-size:14px}
footer{border-top:1px solid var(--rule);margin-top:38px;padding:20px 0 40px;
       color:var(--faint);font-size:12.5px}
.fi{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fi a{color:var(--dim);text-decoration:none}
.fi a:hover{color:var(--go)}

@media(max-width:820px){
  .xw{grid-template-columns:1fr}
  .dsets{grid-template-columns:1fr}
}
@media(max-width:680px){
  .w{padding:0 15px}
  .head{padding:24px 0 20px}
  .head>p{font-size:14.5px}
  .figs{grid-template-columns:repeat(2,1fr)}
  .fig b{font-size:25px}
  .sh{padding:28px 0 10px}
  .sh h2{font-size:16.5px}
  .ctrls{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;padding:11px}
  .dist{height:38px}
  .seg b{font-size:11px}
  .bar2{top:56px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:9px -15px 4px;padding:0 15px 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .r-meta{margin-inline-start:0;margin-top:5px;flex-wrap:wrap}
  .bar{grid-template-columns:64px 1fr auto}
}
</style>
</head>
<body>

<header class="top"><div class="w"><div class="top-in">
  <div class="sig">م</div>
  <div class="nm"><b id="nm"></b><span id="tg"></span></div>
  <button class="lang" id="lang" onclick="toggle()"></button>
</div></div></header>

<div class="w">
  <div class="head">
    <p id="lede"></p>
    <div class="figs" id="figs"></div>
    <div class="cmd">
      <input id="cmd" oninput="doSearch()" autocomplete="off" spellcheck="false">
      <span class="cmd-s" id="cmd-s"></span>
    </div>
    <div id="res"></div>
  </div>

  <div class="sh"><h2 id="h-ex"></h2><a href="corpus/kw-nbcc/controls.json" id="a-ex"></a></div>
  <p class="sub" id="s-ex"></p>
  <div class="panel">
    <div class="dist" id="dist"></div>
    <div class="legend" id="legend"></div>
    <div class="ctrls" id="ctrls"></div>
    <div class="det" id="det"></div>
  </div>

  <div class="sh"><h2 id="h-xw"></h2><a href="publications/0002-validated-regulatory-crosswalk/" id="a-xw"></a></div>
  <p class="sub" id="s-xw"></p>
  <div class="panel"><div class="xw">
    <div id="xw-l"></div><div id="xw-r"></div>
  </div>
  <div class="rev">
    <div style="padding:15px 16px 0"><div style="font-size:14.5px;font-weight:640" id="h-rev"></div>
      <p style="color:var(--faint);font-size:12.8px;max-width:82ch;margin-top:4px" id="s-rev"></p></div>
    <div class="rev-bar" id="rev-bar"></div>
    <div id="rev"></div>
  </div></div>

  <div class="sh"><h2 id="h-ds"></h2><a href="corpus/" id="a-ds"></a></div>
  <div class="dsets" id="dsets"></div>

  <div class="sh"><h2 id="h-pub"></h2><a href="publications/" id="a-pub"></a></div>
  <div class="rows" id="pub"></div>

  <div class="sh"><h2 id="h-idx"></h2><em id="e-idx"></em></div>
  <div class="bar2">
    <input class="q" id="q" oninput="render()" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="out"></div>

  <div class="sh"><h2 id="h-mir"></h2></div>
  <div class="mir"><p id="p-mir"></p><div id="mir"></div></div>
</div>

<footer><div class="w"><div class="fi">
  <span id="f1"></span>
  <span><a href="https://github.com/SiteQ8/Markaz/blob/main/CHARTER.md" id="f2"></a>
  &nbsp;&middot;&nbsp; <a href="https://github.com/SiteQ8" id="f3"></a></span>

const C = {"reg":{"decision":"Decision No. 2 of 2026","decisionAr":"قرار رقم (2) لسنة 2026","deadline":"2027-10-05","authority":"National Cyber Security Center (NCSC)","authorityAr":"المركز الوطني للأمن السيبراني"},"fn":[{"id":"GOV","name":"Govern","nameAr":"الحوكمة","blurb":"Establish and monitor the cybersecurity risk management strategy, expectations and policy.","blurbAr":"وضع استراتيجية إدارة مخاطر الأمن السيبراني والتطلعات والسياسات ومتابعتها.","color":"#7c5cff"},{"id":"ID","name":"Identify","nameAr":"التحديد","blurb":"Determine the current cybersecurity risk to the entity.","blurbAr":"تحديد مخاطر الأمن السيبراني الحالية على الجهة.","color":"#0ea5a4"},{"id":"PR","name":"Protect","nameAr":"الحماية","blurb":"Prevent or reduce cybersecurity risks.","blurbAr":"منع مخاطر الأمن السيبراني أو الحد منها.","color":"#2563eb"},{"id":"DE","name":"Detect","nameAr":"الكشف","blurb":"Find and analyze possible cybersecurity attacks and compromise.","blurbAr":"اكتشاف الهجمات السيبرانية المحتملة وحالات الاختراق وتحليلها.","color":"#d97706"},{"id":"RS","name":"Respond","nameAr":"الاستجابة","blurb":"Take action regarding a detected cybersecurity incident.","blurbAr":"اتخاذ الإجراءات اللازمة حيال أي حادث سيبراني مكتشف.","color":"#dc2626"},{"id":"RC","name":"Recover","nameAr":"التعافي","blurb":"Restore assets and operations impacted by a cybersecurity incident.","blurbAr":"استعادة الأصول والعمليات المتأثرة بالحادث السيبراني.","color":"#059669"},{"id":"CLD","name":"Cloud","nameAr":"الحوسبة السحابية","blurb":"Appendix A minimum controls for entities consuming public cloud services.","blurbAr":"الحد الأدنى من ضوابط الملحق أ للجهات التي تستخدم خدمات الحوسبة السحابية العامة.","color":"#0891b2"}],"controls":[{"id":"GOV-1","fn":"GOV","t":"Governance & Roles","tAr":"الحوكمة والأدوار","r":"The entity MUST designate an employee at manager level or above with overall responsibility for cybersecurity. Define and document roles and responsibilities for information security, IT operations, risk management, data classification, and incident response. Review and update this structure at least annually or when major organizational changes occur.","rAr":"على الجهة أن تعين موظفا بدرجة مدير فما فوق يتولى المسؤولية الشاملة عن الأمن السيبراني، وأن تحدد وتوثق الأدوار والمسؤوليات الخاصة بأمن المعلومات وعمليات تقنية المعلومات وإدارة المخاطر وتصنيف البيانات والاستجابة للحوادث، ثم تراجع هذا الهيكل وتحدثه سنويا على الأقل أو عند وقوع تغييرات تنظيمية جوهرية.","p":"Establish clear accountability for cybersecurity.","pAr":"ترسيخ مساءلة واضحة عن الأمن السيبراني.","ep":null,"epAr":null,"ck":["An employee at manager level or above is formally designated with overall responsibility for cybersecurity.","The designation is documented and traceable to a signed appointment or equivalent record.","Roles and responsibilities are documented for information security.","Roles and responsibilities are documented for IT operations.","Roles and responsibilities are documented for risk management.","Roles and responsibilities are documented for data classification.","Roles and responsibilities are documented for incident response.","The role structure is reviewed and updated at least annually.","The role structure is reviewed after any major organizational change."],"ckAr":["يعين موظف بدرجة مدير فما فوق تعيينا رسميا ليتولى المسؤولية الشاملة عن الأمن السيبراني.","التعيين موثق ويمكن تتبعه إلى كتاب تكليف موقع أو ما يقوم مقامه.","الأدوار والمسؤوليات موثقة لأمن المعلومات.","الأدوار والمسؤوليات موثقة لعمليات تقنية المعلومات.","الأدوار والمسؤوليات موثقة لإدارة المخاطر.","الأدوار والمسؤوليات موثقة لتصنيف البيانات.","الأدوار والمسؤوليات موثقة للاستجابة للحوادث.","هيكل الأدوار يراجع ويحدث سنويا على الأقل.","هيكل الأدوار يراجع عقب أي تغيير تنظيمي جوهري."],"ph":1,"ef":"low","csf":["GV.RR-01","GV.RR-02"],"cis":["17.1"],"iso":["A.5.2","A.5.4"]},{"id":"GOV-2","fn":"GOV","t":"Policies & Exception Management","tAr":"السياسات وإدارة الاستثناءات","r":"Maintain core written policies that, at minimum, cover: acceptable use, Secure Configuration, data classification, access control, backup & recovery, incident response, and third-party / service provider security. Policies SHOULD be approved by management and reviewed at least every two years. Any deviations MUST follow a simple exception process with documented risk acceptance and an expiry date.","rAr":"تحفظ الجهة سياسات مكتوبة أساسية تغطي كحد أدنى الاستخدام المقبول والتهيئة الآمنة وتصنيف البيانات والتحكم في الوصول والنسخ الاحتياطي والاستعادة والاستجابة للحوادث وأمن الأطراف الثالثة ومزودي الخدمة، وينبغي أن تعتمد هذه السياسات من الإدارة وأن تراجع كل سنتين على الأقل، أما أي خروج عنها فيجب أن يمر بآلية استثناء مبسطة تتضمن قبولا موثقا للمخاطر وتاريخ انتهاء.","p":"Ensure behavior and decisions are guided by documented, approved rules.","pAr":"ضمان استناد السلوكيات والقرارات إلى قواعد موثقة ومعتمدة.","ep":null,"epAr":null,"ck":["A written acceptable use policy exists.","A written secure configuration policy exists.","A written data classification policy exists.","A written access control policy exists.","A written backup and recovery policy exists.","A written incident response policy exists.","A written third party and service provider security policy exists.","Policies are approved by management.","Policies are reviewed at least every two years.","A documented exception process exists for deviations from policy.","Every recorded exception carries a documented risk acceptance.","Every recorded exception carries an expiry date."],"ckAr":["توجد سياسة مكتوبة للاستخدام المقبول.","توجد سياسة مكتوبة للتهيئة الآمنة.","توجد سياسة مكتوبة لتصنيف البيانات.","توجد سياسة مكتوبة للتحكم في الوصول.","توجد سياسة مكتوبة للنسخ الاحتياطي والاستعادة.","توجد سياسة مكتوبة للاستجابة للحوادث.","توجد سياسة مكتوبة لأمن الأطراف الثالثة ومزودي الخدمة.","السياسات معتمدة من الإدارة.","تراجع السياسات كل سنتين على الأقل.","توجد آلية موثقة للاستثناء من السياسات.","يحمل كل استثناء مسجل قبولا موثقا للمخاطر.","يحمل كل استثناء مسجل تاريخ انتهاء."],"ph":1,"ef":"medium","csf":["GV.PO-01","GV.PO-02"],"cis":["4.1","14.1"],"iso":["A.5.1","A.5.37"]},{"id":"GOV-3","fn":"GOV","t":"Data Classification & Sovereignty","tAr":"تصنيف البيانات وسيادتها","r":"Implement a data classification program aligned with the National Data Classification Framework, using at least Sensitive, Restricted, and Public categories, with clear criteria and examples. Issue a Data Classification Policy/Document approved by senior management and submitted to NCSC for approval, in accordance with Decision No. 1 of 2025. Tag or label data (and related systems/records) with its classification and ensure protection measures increase with sensitivity (for example: stronger access controls and encryption for Sensitive data). Storing or processing Sensitive data outside Kuwait MUST follow the national approval process and receive explicit NCSC approval before use (per applicable regulations).","rAr":"تطبق الجهة برنامجا لتصنيف البيانات موائما للإطار الوطني لتصنيف البيانات يستخدم فئات حساس ومقيد وعام على الأقل بمعايير وأمثلة واضحة، وتصدر سياسة أو وثيقة لتصنيف البيانات معتمدة من الإدارة العليا ومرفوعة إلى المركز لاعتمادها وفقا للقرار رقم 1 لسنة 2025، ثم توسم البيانات والأنظمة والسجلات المرتبطة بها بتصنيفها وتضمن تصاعد تدابير الحماية مع درجة الحساسية، ومن ذلك مثلا ضوابط وصول وتشفير أقوى للبيانات الحساسة، أما حفظ البيانات الحساسة أو معالجتها خارج الكويت فيجب أن يتبع آلية الاعتماد الوطنية وأن يحصل على موافقة صريحة من المركز قبل الاستخدام وفق اللوائح المعمول بها.","p":"Ensure data is handled according to its sensitivity and legal requirements.","pAr":"ضمان التعامل مع البيانات وفق درجة حساسيتها ومتطلباتها القانونية.","ep":null,"epAr":null,"ck":["A data classification program is implemented and aligned with the National Data Classification Framework.","The scheme uses at least the Sensitive, Restricted and Public categories.","Classification criteria and worked examples are documented.","A Data Classification Policy or Document is approved by senior management.","The Data Classification Document has been submitted to NCSC for approval under Decision No. 1 of 2025.","Data is tagged or labelled with its classification.","Related systems and records carry the classification of the data they hold.","Protection measures demonstrably increase with sensitivity.","Sensitive data receives stronger access controls and encryption than lower tiers.","Any storage or processing of Sensitive data outside Kuwait has explicit prior NCSC approval."],"ckAr":["يطبق برنامج لتصنيف البيانات موائم للإطار الوطني لتصنيف البيانات.","يستخدم التصنيف فئات حساس ومقيد وعام على الأقل.","معايير التصنيف وأمثلته العملية موثقة.","سياسة أو وثيقة تصنيف البيانات معتمدة من الإدارة العليا.","وثيقة تصنيف البيانات مرفوعة إلى المركز لاعتمادها وفق القرار رقم 1 لسنة 2025.","البيانات موسومة بتصنيفها.","تحمل الأنظمة والسجلات المرتبطة تصنيف البيانات التي تحتويها.","تتصاعد تدابير الحماية بوضوح مع درجة الحساسية.","تحظى البيانات الحساسة بضوابط وصول وتشفير أقوى من الفئات الأدنى.","أي حفظ أو معالجة للبيانات الحساسة خارج الكويت له موافقة مسبقة صريحة من المركز."],"ph":1,"ef":"high","csf":["ID.AM-07","GV.PO-01"],"cis":["3.1","3.2","3.7"],"iso":["A.5.12","A.5.13","A.5.34"]},{"id":"GOV-4","fn":"GOV","t":"Kuwaitization & Vetting for Cyber Roles","tAr":"التكويت والمسح الأمني للأدوار السيبرانية","r":"For key cybersecurity roles (e.g., SOC analysts, administrators, incident responders), prioritize qualified Kuwaiti nationals where feasible and consistent with national HR frameworks and local laws and regulations. For staff in such sensitive roles, perform basic pre-employment screening (e.g., identity verification, employment history, conflict-of-interest checks) in line with applicable laws and HR policies. Maintain a simple list of designated \"sensitive cyber roles\" and ensure screening is documented.","rAr":"في الأدوار السيبرانية الرئيسية، ومنها مثلا محللو مركز العمليات الأمنية ومسؤولو الأنظمة والمستجيبون للحوادث، تعطى الأولوية للكوادر الكويتية المؤهلة متى كان ذلك ممكنا وبما يتسق مع أطر الموارد البشرية الوطنية والقوانين واللوائح المحلية، ويجرى للعاملين في هذه الأدوار الحساسة مسح أمني أساسي قبل التعيين يشمل مثلا التحقق من الهوية والتاريخ الوظيفي وتعارض المصالح بما يتفق مع القوانين وسياسات الموارد البشرية السارية، كما تحفظ قائمة مبسطة بالأدوار السيبرانية الحساسة المحددة مع توثيق عمليات المسح الأمني.","p":"Support national capacity building and reduce insider risk in critical cyber roles.","pAr":"دعم بناء القدرات الوطنية والحد من مخاطر التهديد الداخلي في الأدوار السيبرانية الحرجة.","ep":null,"epAr":null,"ck":["Qualified Kuwaiti nationals are prioritized for key cybersecurity roles where feasible.","The prioritization approach is consistent with national HR frameworks and local law.","A list of designated sensitive cyber roles is maintained.","Identity verification is performed before hire into sensitive cyber roles.","Employment history is verified before hire into sensitive cyber roles.","Conflict of interest checks are performed before hire into sensitive cyber roles.","Screening outcomes are documented and retained."],"ckAr":["تعطى الكوادر الكويتية المؤهلة الأولوية في الأدوار السيبرانية الرئيسية متى أمكن.","نهج الأولوية متسق مع أطر الموارد البشرية الوطنية والقوانين المحلية.","تحفظ قائمة بالأدوار السيبرانية الحساسة المحددة.","يجرى مسح أمني للهوية قبل التعيين في الأدوار السيبرانية الحساسة.","يجرى مسح أمني للتاريخ الوظيفي قبل التعيين في الأدوار السيبرانية الحساسة.","يجرى مسح أمني لتعارض المصالح قبل التعيين في الأدوار السيبرانية الحساسة.","نتائج المسح الأمني موثقة ومحفوظة."],"ph":2,"ef":"low","csf":["GV.RR-04","PR.AA-01"],"cis":["14.1"],"iso":["A.6.1","A.6.2","A.6.6"]},{"id":"GOV-5","fn":"GOV","t":"Periodic Self-Assessment & Continuous Improvement","tAr":"التقييم الذاتي الدوري والتحسين المستمر","r":"At least once per year, complete a self-assessment against this baseline using an NCSC-issued or NCSC-approved checklist. Document the results, key gaps, actions, and target dates. Retain the record for at least three years and make it available to NCSC upon request. Use major incidents or audits to update priorities.","rAr":"تستكمل الجهة مرة واحدة سنويا على الأقل تقييما ذاتيا مقابل هذه الضوابط باستخدام قائمة تحقق صادرة عن المركز أو معتمدة منه، وتوثق النتائج والفجوات الرئيسية والإجراءات والتواريخ المستهدفة، ثم تحفظ السجل ثلاث سنوات على الأقل وتتيحه للمركز عند الطلب، وتستفيد من الحوادث الكبرى وعمليات التدقيق في تحديث الأولويات.","p":"Provide a minimal mechanism to measure implementation of this baseline.","pAr":"توفير آلية بسيطة لقياس مدى تطبيق هذه الضوابط.","ep":null,"epAr":null,"ck":["A self assessment against the baseline is completed at least once per year.","The self assessment uses an NCSC issued or NCSC approved checklist.","Results are documented.","Key gaps are documented.","Remediation actions are documented.","Target dates are recorded against each action.","Assessment records are retained for at least three years.","Records can be produced for NCSC on request.","Major incidents and audit findings feed back into assessment priorities."],"ckAr":["يستكمل تقييم ذاتي مقابل الضوابط مرة واحدة سنويا على الأقل.","يستخدم التقييم الذاتي قائمة تحقق صادرة عن المركز أو معتمدة منه.","النتائج موثقة.","الفجوات الرئيسية موثقة.","إجراءات المعالجة موثقة.","تواريخ مستهدفة مسجلة لكل إجراء.","سجلات التقييم محفوظة ثلاث سنوات على الأقل.","يمكن تقديم السجلات للمركز عند الطلب.","تغذي الحوادث الكبرى وملاحظات التدقيق أولويات التقييم."],"ph":1,"ef":"medium","csf":["GV.OV-01","GV.OV-03","ID.IM-02"],"cis":["17.4"],"iso":["A.5.35","A.5.36"]},{"id":"GOV-6","fn":"GOV","t":"Service Provider & Outsourcing Governance","tAr":"حوكمة مزودي الخدمة والإسناد الخارجي","r":"Establish and maintain an inventory of service providers (including cloud/managed services), including classification and an entity contact for each provider; review at least annually or upon significant change.\n• For service providers handling Sensitive data or supporting critical services, document the service scope and shared responsibilities for protecting the service and data.\n• Ensure incident response contact information includes relevant service providers, and define incident reporting timeframes and mechanisms for provider-related incidents.\n• For offboarding/termination, ensure required actions are performed to remove access and handle data appropriately, retaining evidence where applicable.","rAr":"تنشئ الجهة حصرا لمزودي الخدمة يشمل الخدمات السحابية والمدارة وتحفظه، ويتضمن تصنيفا وجهة اتصال داخل الجهة لكل مزود، ويراجع سنويا على الأقل أو عند أي تغيير جوهري.\n• وبالنسبة لمزودي الخدمة الذين يتعاملون مع بيانات حساسة أو يدعمون خدمات حرجة، يوثق نطاق الخدمة والمسؤوليات المشتركة عن حماية الخدمة والبيانات.\n• وتضمن الجهة أن تشمل بيانات الاتصال الخاصة بالاستجابة للحوادث مزودي الخدمة المعنيين، وأن تحدد مهل الإبلاغ عن الحوادث المتعلقة بالمزودين وآلياته.\n• وعند إنهاء التعاقد، تتخذ الإجراءات اللازمة لإزالة الوصول والتعامل مع البيانات على النحو المناسب مع حفظ ما يثبت ذلك حيثما أمكن.","p":"Manage cybersecurity risk arising from external providers, including cloud.","pAr":"إدارة مخاطر الأمن السيبراني الناشئة عن مزودي الخدمات الخارجيين ومنهم مزودو الخدمات السحابية.","ep":null,"epAr":null,"ck":["An inventory of service providers exists and covers cloud and managed services.","Each provider record carries a classification.","Each provider record names an entity contact.","The inventory is reviewed at least annually or upon significant change.","Service scope is documented for providers handling Sensitive data or critical services.","Shared responsibilities for protecting the service and data are documented for those providers.","Incident response contact information includes relevant service providers.","Incident reporting timeframes are defined for provider related incidents.","Incident reporting mechanisms are defined for provider related incidents.","Offboarding actions remove provider access.","Offboarding actions handle provider held data appropriately.","Evidence of offboarding actions is retained."],"ckAr":["يوجد حصر لمزودي الخدمة يشمل الخدمات السحابية والمدارة.","يحمل كل سجل مزود تصنيفا.","يسمي كل سجل مزود جهة اتصال داخل الجهة.","يراجع الحصر سنويا على الأقل أو عند أي تغيير جوهري.","نطاق الخدمة موثق لمزودي البيانات الحساسة أو الخدمات الحرجة.","المسؤوليات المشتركة عن حماية الخدمة والبيانات موثقة لهؤلاء المزودين.","بيانات الاتصال للاستجابة للحوادث تشمل مزودي الخدمة المعنيين.","مهل الإبلاغ عن الحوادث المتعلقة بالمزودين محددة.","آليات الإبلاغ عن الحوادث المتعلقة بالمزودين محددة.","إجراءات إنهاء التعاقد تزيل وصول المزود.","تعالج إجراءات إنهاء التعاقد البيانات المحفوظة لدى المزود على النحو المناسب.","ما يثبت تنفيذ إجراءات إنهاء التعاقد محفوظ."],"ph":2,"ef":"medium","csf":["GV.SC-04","GV.SC-07","GV.SC-10"],"cis":["15.1","15.2","15.4"],"iso":["A.5.19","A.5.20","A.5.21","A.5.22"]},{"id":"ID-1","fn":"ID","t":"Asset & Service Inventory","tAr":"حصر الأصول والخدمات","r":"Maintain a central electronic inventory of hardware assets (servers, workstations, laptops, network equipment, IoT/OT devices, etc.) and key on-premises services. Record at least: owner, location, purpose, criticality, and lifecycle state (in use, spare, retired). For physical assets, use unique, machine-readable labels (e.g., barcode/QR-style) to support scanning and tracking. At least weekly, review network discovery or similar tools to identify unauthorized devices and either remove, block, or formally approve them.","rAr":"تحفظ الجهة حصرا إلكترونيا مركزيا لأصول العتاد، ومنها الخوادم ومحطات العمل والحواسيب المحمولة ومعدات الشبكة وأجهزة إنترنت الأشياء والتقنيات التشغيلية وغيرها، وكذلك الخدمات الرئيسية داخل المقر، ويسجل فيه كحد أدنى المالك والموقع والغرض ودرجة الحرجية وحالة دورة الحياة من حيث كونه قيد الاستخدام أو احتياطيا أو مسحوبا، أما الأصول المادية فتوسم بملصقات فريدة قابلة للقراءة آليا مثل الباركود أو رمز الاستجابة السريعة بما يدعم المسح والتتبع، وتراجع الجهة أسبوعيا على الأقل مخرجات أدوات اكتشاف الشبكة أو ما شابهها لتحديد الأجهزة غير المصرح بها ثم تزيلها أو تحجبها أو تعتمدها رسميا.","p":"Maintain an up-to-date view of hardware and key services.","pAr":"الاحتفاظ بصورة محدثة عن الأجهزة والخدمات الرئيسية.","ep":null,"epAr":null,"ck":["A central electronic inventory of hardware assets is maintained.","The inventory covers servers, workstations, laptops, network equipment and IoT or OT devices.","Key on premises services are recorded in the inventory.","Each asset record captures an owner.","Each asset record captures a location.","Each asset record captures a purpose.","Each asset record captures a criticality rating.","Each asset record captures a lifecycle state of in use, spare or retired.","Physical assets carry unique machine readable labels.","Network discovery output is reviewed at least weekly.","Unauthorized devices found are removed, blocked or formally approved."],"ckAr":["يحفظ حصر إلكتروني مركزي لأصول العتاد.","يشمل الحصر الخوادم ومحطات العمل والحواسيب المحمولة ومعدات الشبكة وأجهزة إنترنت الأشياء أو التقنيات التشغيلية.","الخدمات الرئيسية داخل المقر مسجلة في الحصر.","يحمل كل سجل أصل مالكا.","يحمل كل سجل أصل موقعا.","يحمل كل سجل أصل غرضا.","يحمل كل سجل أصل درجة حرجية.","يحمل كل سجل أصل حالة دورة حياة قيد الاستخدام أو احتياطي أو مسحوب.","تحمل الأصول المادية ملصقات فريدة قابلة للقراءة آليا.","تراجع مخرجات اكتشاف الشبكة أسبوعيا على الأقل.","تزال الأجهزة غير المصرح بها المكتشفة أو تحجب أو تعتمد رسميا."],"ph":1,"ef":"high","csf":["ID.AM-01","ID.AM-02"],"cis":["1.1","1.2"],"iso":["A.5.9","A.5.10","A.7.9"]},{"id":"ID-2","fn":"ID","t":"Software & Provider Inventory","tAr":"حصر البرمجيات ومزودي الخدمة","r":"Maintain a list of authorized software (including version families) and service providers (including cloud and SaaS). At least monthly, review systems for unauthorized software and either remove it or record a documented exception. The list register SHOULD include owner, contact details, service description, criticality, and data sensitivity (which classifications are processed). Review provider information at least annually.","rAr":"تحفظ الجهة قائمة بالبرمجيات المصرح بها بما في ذلك عائلات الإصدارات، وقائمة بمزودي الخدمة بما في ذلك الخدمات السحابية والبرمجيات كخدمة، وتراجع الأنظمة شهريا على الأقل بحثا عن برمجيات غير مصرح بها فتزيلها أو تسجل لها استثناء موثقا، وينبغي أن يتضمن السجل المالك وبيانات الاتصال ووصف الخدمة ودرجة الحرجية وحساسية البيانات أي التصنيفات التي تعالج، وتراجع معلومات المزودين سنويا على الأقل.","p":"Maintain visibility of software in use and service providers.","pAr":"الحفاظ على وضوح الرؤية بشأن البرمجيات المستخدمة ومزودي الخدمات.","ep":null,"epAr":null,"ck":["A list of authorized software is maintained.","The software list records version families.","A list of service providers is maintained and includes cloud and SaaS.","Systems are reviewed at least monthly for unauthorized software.","Unauthorized software found is removed or covered by a documented exception.","The register records an owner for each entry.","The register records contact details for each entry.","The register records a service description for each entry.","The register records criticality for each entry.","The register records which data classifications are processed.","Provider information is reviewed at least annually."],"ckAr":["تحفظ قائمة بالبرمجيات المصرح بها.","تسجل قائمة البرمجيات عائلات الإصدارات.","تحفظ قائمة بمزودي الخدمة تشمل الخدمات السحابية والبرمجيات كخدمة.","تراجع الأنظمة شهريا على الأقل بحثا عن برمجيات غير مصرح بها.","تزال البرمجيات غير المصرح بها المكتشفة أو يغطيها استثناء موثق.","يبين السجل مالكا لكل مدخل.","يبين السجل بيانات اتصال لكل مدخل.","يبين السجل وصفا للخدمة لكل مدخل.","يبين السجل درجة الحرجية لكل مدخل.","يبين السجل تصنيفات البيانات التي تعالج.","تراجع معلومات المزودين سنويا على الأقل."],"ph":1,"ef":"medium","csf":["ID.AM-02","GV.SC-04"],"cis":["2.1","2.3","15.1"],"iso":["A.5.9","A.8.19"]},{"id":"ID-3","fn":"ID","t":"Data & Account Inventory","tAr":"حصر البيانات والحسابات","r":"Maintain an inventory of critical and sensitive data sets, including classification, location, and business owner. Maintain an inventory of user and service accounts including privileges and last activity. Review accounts at least quarterly. Disable or remove dormant interactive user accounts that have not been used for 90 days, where the technology supports it. Review service accounts at least quarterly to validate continued business need. Ensure high-risk or privileged accounts are clearly identified.","rAr":"تحفظ الجهة حصرا لمجموعات البيانات الحرجة والحساسة يتضمن التصنيف والموقع والمالك من جهة الأعمال، وحصرا لحسابات المستخدمين وحسابات الخدمة يتضمن الصلاحيات وآخر نشاط، وتراجع الحسابات ربع سنويا على الأقل، وتعطل أو تزيل حسابات المستخدمين التفاعلية الخاملة التي لم تستخدم تسعين يوما متى كانت التقنية تدعم ذلك، وتراجع حسابات الخدمة ربع سنويا على الأقل للتحقق من استمرار الحاجة إليها، وتضمن تحديد الحسابات عالية الخطورة أو ذات الصلاحيات تحديدا واضحا.","p":"Understand what data and accounts exist and who owns them.","pAr":"معرفة البيانات والحسابات القائمة ومالكيها.","ep":null,"epAr":null,"ck":["An inventory of critical and sensitive data sets is maintained.","Each data set record carries a classification.","Each data set record carries a location.","Each data set record carries a business owner.","An inventory of user and service accounts is maintained.","Account records capture privileges.","Account records capture last activity.","Accounts are reviewed at least quarterly.","Dormant interactive user accounts unused for 90 days are disabled or removed where supported.","Service accounts are reviewed at least quarterly to validate continued business need.","High risk and privileged accounts are clearly identified."],"ckAr":["يحفظ حصر لمجموعات البيانات الحرجة والحساسة.","يحمل كل سجل مجموعة بيانات تصنيفا.","يحمل كل سجل مجموعة بيانات موقعا.","يحمل كل سجل مجموعة بيانات مالكا من جهة الأعمال.","يحفظ حصر لحسابات المستخدمين وحسابات الخدمة.","تبين سجلات الحسابات الصلاحيات.","تبين سجلات الحسابات آخر نشاط.","تراجع الحسابات ربع سنويا على الأقل.","تعطل حسابات المستخدمين التفاعلية الخاملة تسعين يوما أو تزال حيثما أمكن.","تراجع حسابات الخدمة ربع سنويا على الأقل للتحقق من استمرار الحاجة إليها.","الحسابات عالية الخطورة وذات الصلاحيات محددة بوضوح."],"ph":1,"ef":"medium","csf":["ID.AM-07","PR.AA-01","PR.AA-05"],"cis":["3.1","5.1","5.3"],"iso":["A.5.9","A.5.16","A.5.18"]},{"id":"PR-1","fn":"PR","t":"Secure Configuration, Hardening & Network Segmentation","tAr":"التهيئة الآمنة والتحصين وتجزئة الشبكة","r":"Establish hardened configuration baselines for servers, workstations, network devices, and key applications. From this baseline, disable or remove services, features and ports that are not needed for the system’s role. Change or disable default accounts and default passwords. Enable a host-based firewall on endpoints and servers and allow only the network traffic required for normal operation. Review configurations at least annually and after major changes.","rAr":"تضع الجهة إعدادات مرجعية محصنة للخوادم ومحطات العمل وأجهزة الشبكة والتطبيقات الرئيسية، وتعطل أو تزيل انطلاقا من هذه الإعدادات الخدمات والخصائص والمنافذ غير اللازمة لدور النظام، وتغير أو تعطل الحسابات وكلمات المرور الافتراضية، وتفعل جدار حماية على مستوى المضيف في الأجهزة الطرفية والخوادم لا يسمح إلا بحركة البيانات اللازمة للتشغيل الطبيعي، وتراجع الإعدادات سنويا على الأقل وبعد التغييرات الجوهرية.","p":"Reduce the attack surface of systems and devices.","pAr":"تقليص سطح الهجوم على الأنظمة والأجهزة.","ep":null,"epAr":null,"ck":["Hardened configuration baselines exist for servers.","Hardened configuration baselines exist for workstations.","Hardened configuration baselines exist for network devices.","Hardened configuration baselines exist for key applications.","Services and features not needed for the system role are disabled or removed.","Ports not needed for the system role are disabled or removed.","Default accounts are changed or disabled.","Default passwords are changed or disabled.","A host based firewall is enabled on endpoints and servers.","Host firewall rules allow only the traffic required for normal operation.","Configurations are reviewed at least annually.","Configurations are reviewed after major changes."],"ckAr":["توجد إعدادات مرجعية محصنة للخوادم.","توجد إعدادات مرجعية محصنة لمحطات العمل.","توجد إعدادات مرجعية محصنة لأجهزة الشبكة.","توجد إعدادات مرجعية محصنة للتطبيقات الرئيسية.","الخدمات والخصائص غير اللازمة لدور النظام معطلة أو مزالة.","المنافذ غير اللازمة لدور النظام معطلة أو مزالة.","الحسابات الافتراضية مغيرة أو معطلة.","كلمات المرور الافتراضية مغيرة أو معطلة.","جدار حماية على مستوى المضيف مفعل على الأجهزة الطرفية والخوادم.","قواعد جدار حماية المضيف تسمح فقط بحركة البيانات اللازمة للتشغيل الطبيعي.","تراجع الإعدادات سنويا على الأقل.","تراجع الإعدادات عقب التغييرات الجوهرية."],"ph":2,"ef":"high","csf":["PR.PS-01","PR.IR-01"],"cis":["4.1","4.2","4.4","4.5","4.6","4.7","4.8"],"iso":["A.8.9"]},{"id":"PR-1.1","fn":"PR","t":"Network Segmentation","tAr":"تجزئة الشبكة","r":"Where feasible, separate user networks from server/data networks, and keep management/admin interfaces on a more restricted network segment. Place internet-facing systems in a more controlled network zone. Avoid direct access from user networks to sensitive servers unless explicitly required and approved.\n• Do not treat network location alone as sufficient basis for trust. Access to management/admin interfaces and Critical Systems MUST be explicitly authorized based on least privilege and protected with strong authentication in accordance with PR-2 (including MFA for administrative access where supported).\n• Document such access and review it at least annually.","rAr":"تفصل الجهة متى أمكن شبكات المستخدمين عن شبكات الخوادم والبيانات، وتبقي واجهات الإدارة في مقطع شبكي أكثر تقييدا، وتضع الأنظمة المتصلة بالإنترنت في منطقة شبكية أكثر ضبطا، وتتجنب الوصول المباشر من شبكات المستخدمين إلى الخوادم الحساسة ما لم يكن مطلوبا ومعتمدا صراحة.\n• ولا يعد الموقع الشبكي وحده أساسا كافيا للثقة، إذ يجب اعتماد الوصول إلى واجهات الإدارة والأنظمة الحرجة اعتمادا صريحا قائما على أقل الصلاحيات وحمايته بمصادقة قوية وفق الضابط PR-2 بما في ذلك المصادقة متعددة العوامل للوصول الإداري حيثما كانت مدعومة.\n• ويوثق هذا الوصول ويراجع سنويا على الأقل.","p":"Limit the spread and impact of attacks by separating networks.","pAr":"الحد من انتشار الهجمات وأثرها عبر الفصل بين الشبكات.","ep":null,"epAr":null,"ck":["User networks are separated from server and data networks where feasible.","Management and admin interfaces sit on a more restricted network segment.","Internet facing systems are placed in a more controlled network zone.","Direct access from user networks to sensitive servers is avoided unless explicitly required and approved.","Network location alone is not treated as sufficient basis for trust.","Access to management and admin interfaces is explicitly authorized on least privilege.","Access to Critical Systems is explicitly authorized on least privilege.","Strong authentication protects management and admin access in line with PR-2.","MFA protects administrative access where supported.","Such access is documented.","Such access is reviewed at least annually."],"ckAr":["شبكات المستخدمين مفصولة عن شبكات الخوادم والبيانات متى أمكن.","واجهات الإدارة موضوعة في مقطع شبكي أكثر تقييدا.","الأنظمة المتصلة بالإنترنت موضوعة في منطقة شبكية أكثر ضبطا.","الوصول المباشر من شبكات المستخدمين إلى الخوادم الحساسة متجنب ما لم يكن مطلوبا ومعتمدا صراحة.","لا يعد الموقع الشبكي وحده أساسا كافيا للثقة.","الوصول إلى واجهات الإدارة معتمد صراحة على أساس أقل الصلاحيات.","الوصول إلى الأنظمة الحرجة معتمد صراحة على أساس أقل الصلاحيات.","مصادقة قوية تحمي الوصول الإداري بما يتفق مع الضابط PR-2.","تحمي المصادقة متعددة العوامل الوصول الإداري حيثما كان مدعوما.","هذا الوصول موثق.","هذا الوصول يراجع سنويا على الأقل."],"ph":2,"ef":"high","csf":["PR.IR-01","PR.AA-05"],"cis":["12.2","4.6","13.4"],"iso":["A.8.20","A.8.22"]},{"id":"PR-1.2","fn":"PR","t":"Vulnerability Management & Patching","tAr":"إدارة الثغرات والتحديثات الأمنية","r":"Have a simple written process for vulnerability management and review it at least annually. Run automated vulnerability scans on key systems: at least monthly for internet-facing systems, at least quarterly for other important internal systems, and after major changes. After each scan, review the report, produce a short action list, and fix the most serious issues first (for example, high and critical findings). Aim to apply operating system and application patches at least monthly on supported systems. Keep records of scans and key remediation actions.","rAr":"تعتمد الجهة آلية مكتوبة مبسطة لإدارة الثغرات وتراجعها سنويا على الأقل، وتجري فحوصا آلية للثغرات على الأنظمة الرئيسية بواقع شهري على الأقل للأنظمة المتصلة بالإنترنت وربع سنوي على الأقل لسائر الأنظمة الداخلية المهمة وكذلك بعد التغييرات الجوهرية، وتراجع بعد كل فحص تقريره وتعد قائمة إجراءات موجزة وتعالج أخطر المسائل أولا كالنتائج العالية والحرجة، وتسعى إلى تطبيق تحديثات أنظمة التشغيل والتطبيقات شهريا على الأقل على الأنظمة المدعومة، وتحفظ سجلات الفحوص وإجراءات المعالجة الرئيسية.","p":"Identify and address technical weaknesses in a structured way.","pAr":"اكتشاف نقاط الضعف التقنية ومعالجتها بأسلوب منهجي.","ep":null,"epAr":null,"ck":["A written vulnerability management process exists.","The process is reviewed at least annually.","Automated vulnerability scans run at least monthly on internet facing systems.","Automated vulnerability scans run at least quarterly on other important internal systems.","Scans are run after major changes.","Each scan report is reviewed.","A short action list is produced after each scan.","High and critical findings are prioritized for fixing.","Operating system patches are applied at least monthly on supported systems.","Application patches are applied at least monthly on supported systems.","Records of scans are retained.","Records of key remediation actions are retained."],"ckAr":["توجد آلية مكتوبة لإدارة الثغرات.","تراجع الآلية سنويا على الأقل.","تجرى فحوص الثغرات الآلية شهريا على الأقل للأنظمة المتصلة بالإنترنت.","تجرى فحوص الثغرات الآلية ربع سنويا على الأقل لسائر الأنظمة الداخلية المهمة.","تجرى الفحوص عقب التغييرات الجوهرية.","يراجع كل تقرير فحص.","تعد قائمة إجراءات موجزة عقب كل فحص.","تعطى النتائج العالية والحرجة أولوية المعالجة.","تطبق تحديثات أنظمة التشغيل شهريا على الأقل على الأنظمة المدعومة.","تطبق تحديثات التطبيقات شهريا على الأقل على الأنظمة المدعومة.","سجلات الفحوص محفوظة.","سجلات إجراءات المعالجة الرئيسية محفوظة."],"ph":2,"ef":"high","csf":["ID.RA-01","ID.RA-06","PR.PS-02"],"cis":["7.1","7.3","7.4","7.5","7.6"],"iso":["A.8.8"]},{"id":"PR-2","fn":"PR","t":"Identity, Authentication & Password Hygiene","tAr":"الهوية والمصادقة وسلامة كلمات المرور","r":"Require unique passwords for all accounts; do not reuse the same password across different systems. As a simple rule, require at least 8 characters for accounts protected by multi-factor authentication (MFA) and at least 14 characters for accounts without MFA. Avoid forcing regular password changes unless compromise is suspected. Enforce session lock or screen saver after 15 minutes of inactivity for workstations and around 2 minutes for mobile devices where practical. Limit administrator privileges to dedicated admin accounts, and require staff to perform day-to-day activities (email, web browsing, office work) from a normal user account. Implement MFA for all remote network access, externally exposed applications, and privileged/admin accounts where supported, using at least two different types of factor (something you know, something you have, something you are).","rAr":"تشترط الجهة كلمات مرور فريدة لجميع الحسابات دون إعادة استخدام كلمة المرور نفسها عبر أنظمة مختلفة، وكقاعدة مبسطة تشترط ثمانية محارف على الأقل للحسابات المحمية بالمصادقة متعددة العوامل وأربعة عشر محرفا على الأقل للحسابات غير المحمية بها، وتتجنب فرض تغيير دوري لكلمات المرور ما لم يشتبه في اختراق، وتفرض قفل الجلسة أو شاشة التوقف بعد خمس عشرة دقيقة من الخمول في محطات العمل ونحو دقيقتين في الأجهزة المحمولة متى كان ذلك عمليا، وتقصر صلاحيات المدير على حسابات إدارية مخصصة وتلزم الموظفين بأداء أعمالهم اليومية من بريد وتصفح وأعمال مكتبية من حساب مستخدم عادي، وتطبق المصادقة متعددة العوامل على كل وصول شبكي عن بعد وعلى التطبيقات المكشوفة خارجيا وعلى الحسابات ذات الصلاحيات والحسابات الإدارية حيثما كانت مدعومة، على أن تستخدم نوعين مختلفين على الأقل من العوامل أي شيء تعرفه وشيء تملكه وشيء تكونه.","p":"Ensure access is properly controlled and accounts are harder to compromise.","pAr":"ضمان ضبط الوصول على نحو سليم وجعل اختراق الحسابات أصعب.","ep":null,"epAr":null,"ck":["Unique passwords are required for all accounts.","Password reuse across different systems is prohibited.","Accounts protected by MFA require at least 8 characters.","Accounts without MFA require at least 14 characters.","Regular forced password changes are avoided unless compromise is suspected.","Workstations lock the session after 15 minutes of inactivity.","Mobile devices lock after around 2 minutes of inactivity where practical.","Administrator privileges are limited to dedicated admin accounts.","Staff perform day to day activities from a normal user account.","MFA is implemented for all remote network access.","MFA is implemented for externally exposed applications.","MFA is implemented for privileged and admin accounts where supported.","MFA uses at least two different types of factor."],"ckAr":["كلمات مرور فريدة مطلوبة لجميع الحسابات.","إعادة استخدام كلمات المرور عبر أنظمة مختلفة محظورة.","تتطلب الحسابات المحمية بالمصادقة متعددة العوامل ثمانية محارف على الأقل.","تتطلب الحسابات غير المحمية بالمصادقة متعددة العوامل أربعة عشر محرفا على الأقل.","التغيير الدوري الإجباري لكلمات المرور متجنب ما لم يشتبه في اختراق.","تقفل محطات العمل الجلسة بعد خمس عشرة دقيقة من الخمول.","تقفل الأجهزة المحمولة بعد نحو دقيقتين من الخمول حيثما كان ذلك عمليا.","صلاحيات المدير مقصورة على حسابات إدارية مخصصة.","يؤدي الموظفون أعمالهم اليومية من حساب مستخدم عادي.","المصادقة متعددة العوامل مطبقة على كل وصول شبكي عن بعد.","المصادقة متعددة العوامل مطبقة على التطبيقات المكشوفة خارجيا.","المصادقة متعددة العوامل مطبقة على الحسابات ذات الصلاحيات والحسابات الإدارية حيثما كانت مدعومة.","تستخدم المصادقة متعددة العوامل نوعين مختلفين على الأقل من العوامل."],"ph":1,"ef":"medium","csf":["PR.AA-01","PR.AA-02","PR.AA-03","PR.AA-05"],"cis":["5.2","5.4","6.3","6.4","6.5"],"iso":["A.5.15","A.5.16","A.5.17","A.8.5"]},{"id":"PR-2.1","fn":"PR","t":"Corporate Email Only & Personal Email Ban","tAr":"قصر المراسلات على البريد المؤسسي ومنع البريد الشخصي","r":"Require that all official business communications use only Entity-approved corporate email accounts on approved domains. Personal/consumer email accounts MUST NOT be configured on corporate devices and MUST NOT be used for work-related communication. Enforce this via (1) an acceptable use policy, and (2) device and email configuration (e.g., MDM or mail client settings) that prevent adding personal accounts where feasible.","rAr":"تشترط الجهة أن تجري كل مراسلات العمل الرسمية عبر حسابات بريد مؤسسي معتمدة منها وعلى نطاقات معتمدة، ولا يجوز تهيئة حسابات البريد الشخصي أو الاستهلاكي على أجهزة الجهة ولا استخدامها في المراسلات المتعلقة بالعمل، ويفرض ذلك أولا بسياسة للاستخدام المقبول وثانيا بإعدادات الأجهزة والبريد كنظام إدارة الأجهزة أو إعدادات عميل البريد بما يمنع إضافة الحسابات الشخصية متى أمكن.","p":"Ensure work communications use managed, auditable channels and reduce data leakage via personal email.","pAr":"ضمان مرور مراسلات العمل عبر قنوات مدارة قابلة للتدقيق والحد من تسرب البيانات عبر البريد الشخصي.","ep":null,"epAr":null,"ck":["All official business communication uses entity approved corporate email accounts.","Corporate email runs on approved domains.","Personal or consumer email accounts are not configured on corporate devices.","Personal or consumer email accounts are not used for work related communication.","An acceptable use policy states the requirement.","Device and email configuration prevents adding personal accounts where feasible."],"ckAr":["تستخدم كل مراسلات العمل الرسمية حسابات بريد مؤسسي معتمدة من الجهة.","يعمل البريد المؤسسي على نطاقات معتمدة.","حسابات البريد الشخصي أو الاستهلاكي غير مهيأة على أجهزة الجهة.","لا تستخدم حسابات البريد الشخصي أو الاستهلاكي في المراسلات المتعلقة بالعمل.","سياسة الاستخدام المقبول تنص على هذا الاشتراط.","تمنع إعدادات الأجهزة والبريد إضافة الحسابات الشخصية متى أمكن."],"ph":1,"ef":"low","csf":["PR.DS-02","GV.PO-01"],"cis":["9.1","14.1"],"iso":["A.5.14","A.8.1"]},{"id":"PR-2.2","fn":"PR","t":"Password Manager & Credential Hygiene","tAr":"مدير كلمات المرور وسلامة بيانات الاعتماد","r":"Provide or approve a password-manager-style solution for staff who manage multiple credentials. Encourage use of long, unique passwords generated by the manager for each system. For shared/team accounts (where unavoidable), use shared password vaults or similar capabilities; do not share passwords through email, chat, or on paper.","rAr":"توفر الجهة أو تعتمد حلا من نوع مدير كلمات المرور للموظفين الذين يديرون بيانات اعتماد متعددة، وتشجع استخدام كلمات مرور طويلة وفريدة يولدها المدير لكل نظام، وتستخدم للحسابات المشتركة أو حسابات الفرق عند تعذر تجنبها خزائن كلمات مرور مشتركة أو قدرات مماثلة، ولا تتبادل كلمات المرور عبر البريد الإلكتروني أو المحادثات أو على الورق.","p":"Help staff maintain strong, unique passwords without reuse.","pAr":"مساعدة الموظفين على استخدام كلمات مرور قوية وفريدة دون تكرار.","ep":null,"epAr":null,"ck":["A password manager style solution is provided or approved for staff managing multiple credentials.","Long unique generated passwords are encouraged for each system.","Shared or team accounts use a shared password vault or similar capability.","Passwords are not shared through email.","Passwords are not shared through chat.","Passwords are not shared on paper."],"ckAr":["يوفر أو يعتمد حل من نوع مدير كلمات المرور للموظفين الذين يديرون بيانات اعتماد متعددة.","يشجع استخدام كلمات مرور طويلة وفريدة ومولدة لكل نظام.","تستخدم الحسابات المشتركة أو حسابات الفرق خزانة كلمات مرور مشتركة أو قدرة مماثلة.","كلمات المرور لا تتبادل عبر البريد الإلكتروني.","كلمات المرور لا تتبادل عبر المحادثات.","كلمات المرور لا تتبادل على الورق."],"ph":2,"ef":"low","csf":["PR.AA-01","PR.AT-01"],"cis":["5.2","14.1"],"iso":["A.5.17"]},{"id":"PR-3","fn":"PR","t":"Awareness & Human Factors","tAr":"التوعية والعوامل البشرية","r":"Establish a security awareness program and provide training at least annually and for new joiners. At minimum, cover: social engineering and phishing, safe use of email and the web, handling of Sensitive and Restricted data, password and MFA hygiene, use of approved communication tools, use of portable media, and how to report suspicious activity or incidents. Use simple language and relevant examples.","rAr":"تنشئ الجهة برنامجا للتوعية الأمنية وتقدم التدريب سنويا على الأقل وللموظفين الجدد، ويغطي كحد أدنى الهندسة الاجتماعية والتصيد والاستخدام الآمن للبريد الإلكتروني والإنترنت والتعامل مع البيانات الحساسة والمقيدة وسلامة كلمات المرور والمصادقة متعددة العوامل واستخدام أدوات التواصل المعتمدة واستخدام وسائط التخزين الخارجية وكيفية الإبلاغ عن النشاط المشبوه أو الحوادث، وتستخدم في ذلك لغة بسيطة وأمثلة ذات صلة.","p":"Build a basic culture of secure behavior.","pAr":"بناء ثقافة أساسية للسلوك الآمن.","ep":null,"epAr":null,"ck":["A security awareness program is established.","Training is delivered at least annually.","Training is delivered to new joiners.","Training covers social engineering and phishing.","Training covers safe use of email and the web.","Training covers handling of Sensitive and Restricted data.","Training covers password and MFA hygiene.","Training covers use of approved communication tools.","Training covers use of portable media.","Training covers how to report suspicious activity or incidents.","Material uses simple language and relevant examples."],"ckAr":["يوجد برنامج للتوعية الأمنية.","يقدم التدريب سنويا على الأقل.","يقدم التدريب للموظفين الجدد.","يغطي التدريب الهندسة الاجتماعية والتصيد.","يغطي التدريب الاستخدام الآمن للبريد الإلكتروني والإنترنت.","يغطي التدريب التعامل مع البيانات الحساسة والمقيدة.","يغطي التدريب سلامة كلمات المرور والمصادقة متعددة العوامل.","يغطي التدريب استخدام أدوات التواصل المعتمدة.","يغطي التدريب استخدام وسائط التخزين الخارجية.","يغطي التدريب كيفية الإبلاغ عن النشاط المشبوه أو الحوادث.","تستخدم المواد لغة بسيطة وأمثلة ذات صلة."],"ph":1,"ef":"medium","csf":["PR.AT-01","PR.AT-02"],"cis":["14.1","14.2","14.3","14.6"],"iso":["A.6.3"]},{"id":"PR-3.1","fn":"PR","t":"Official Social Media & Digital Presence","tAr":"الحسابات الرسمية والحضور الرقمي","r":"Maintain a central register of official Entity accounts on external platforms (e.g., major social networks, video platforms). Create official accounts using corporate email addresses and appropriate naming conventions. Where the platform provides it and criteria are met, enable verification or \"official\" status. Protect these accounts with MFA and role-based administration; review access at least annually and remove access when staff leave or change roles.","rAr":"تحفظ الجهة سجلا مركزيا لحساباتها الرسمية على المنصات الخارجية كشبكات التواصل ومنصات الفيديو الكبرى، وتنشئ الحسابات الرسمية باستخدام عناوين بريد مؤسسي وأعراف تسمية مناسبة، وتفعل التوثيق أو صفة الحساب الرسمي حيثما توفرها المنصة واستوفيت شروطها، وتحمي هذه الحسابات بالمصادقة متعددة العوامل وتديرها وفق الأدوار، وتراجع الوصول إليها سنويا على الأقل وتزيله عند مغادرة الموظفين أو تغير أدوارهم.","p":"Ensure official accounts are authentic, protected, and clearly distinguished from impostors.","pAr":"ضمان أصالة الحسابات الرسمية وحمايتها وتمييزها بوضوح عن الحسابات المنتحلة.","ep":null,"epAr":null,"ck":["A central register of official entity accounts on external platforms is maintained.","Official accounts are created using corporate email addresses.","Official accounts follow appropriate naming conventions.","Verification or official status is enabled where the platform provides it and criteria are met.","Official accounts are protected with MFA.","Official accounts use role based administration.","Access to official accounts is reviewed at least annually.","Access is removed when staff leave or change roles."],"ckAr":["يحفظ سجل مركزي لحسابات الجهة الرسمية على المنصات الخارجية.","تنشأ الحسابات الرسمية باستخدام عناوين بريد مؤسسي.","تتبع الحسابات الرسمية أعرافا مناسبة في التسمية.","التوثيق أو صفة الحساب الرسمي مفعلة حيثما توفرها المنصة واستوفيت شروطها.","الحسابات الرسمية محمية بالمصادقة متعددة العوامل.","تدار الحسابات الرسمية وفق الأدوار.","يراجع الوصول إلى الحسابات الرسمية سنويا على الأقل.","يزال الوصول عند مغادرة الموظف أو تغير دوره."],"ph":2,"ef":"low","csf":["PR.AA-05","ID.AM-02"],"cis":["5.1","6.5"],"iso":["A.5.16","A.8.5"]},{"id":"PR-4","fn":"PR","t":"Malware, Email & Web Protection","tAr":"الحماية من البرمجيات الخبيثة وحماية البريد والويب","r":"Deploy endpoint protection (e.g., anti-malware/EDR software) on supported servers and workstations with automatic updates and centralized alerting where possible. Use email and web security controls (e.g., spam filtering, attachment and URL filtering) to block common malicious content and clearly suspicious file types. Configure email systems to block or warn on dangerous file extensions that are not needed for business and to limit very large attachments according to business need. Configure email domains with appropriate anti-spoofing controls (SPF, DKIM, DMARC) to prevent impersonation. Train staff to be cautious with unexpected links and attachments, and to report suspicious messages.","rAr":"تنشر الجهة حلول حماية الأجهزة الطرفية كبرمجيات مكافحة البرمجيات الخبيثة أو الكشف والاستجابة على الخوادم ومحطات العمل المدعومة مع تحديث تلقائي وتنبيه مركزي متى أمكن، وتستخدم ضوابط أمن البريد والويب كترشيح الرسائل المزعجة والمرفقات والروابط لحجب المحتوى الخبيث الشائع وأنواع الملفات المشبوهة بوضوح، وتهيئ أنظمة البريد لحجب امتدادات الملفات الخطرة غير اللازمة للعمل أو التنبيه عليها ولتحديد المرفقات الكبيرة جدا وفق حاجة العمل، وتهيئ نطاقات البريد بضوابط مناسبة لمنع الانتحال هي SPF وDKIM وDMARC، وتدرب الموظفين على الحذر من الروابط والمرفقات غير المتوقعة وعلى الإبلاغ عن الرسائل المشبوهة.","p":"Reduce the risk of malware and phishing attacks.","pAr":"تقليل مخاطر البرمجيات الخبيثة وهجمات التصيد.","ep":null,"epAr":null,"ck":["Endpoint protection is deployed on supported servers.","Endpoint protection is deployed on supported workstations.","Endpoint protection signatures and engines update automatically.","Centralized alerting is in place where possible.","Email security controls block common malicious content.","Web security controls block common malicious content.","Email systems block or warn on dangerous file extensions not needed for business.","Very large attachments are limited according to business need.","SPF is configured on entity email domains.","DKIM is configured on entity email domains.","DMARC is configured on entity email domains.","Staff are trained to be cautious with unexpected links and attachments.","Staff are trained to report suspicious messages."],"ckAr":["حماية الأجهزة الطرفية منشورة على الخوادم المدعومة.","حماية الأجهزة الطرفية منشورة على محطات العمل المدعومة.","تحدث بصمات ومحركات حماية الأجهزة الطرفية تلقائيا.","يوجد تنبيه مركزي حيثما أمكن.","تحجب ضوابط أمن البريد المحتوى الخبيث الشائع.","تحجب ضوابط أمن الويب المحتوى الخبيث الشائع.","تحجب أنظمة البريد أو تنبه على امتدادات الملفات الخطرة غير اللازمة للعمل.","المرفقات الكبيرة جدا محدودة وفق حاجة العمل.","سجل SPF مهيأ على نطاقات بريد الجهة.","سجل DKIM مهيأ على نطاقات بريد الجهة.","سجل DMARC مهيأ على نطاقات بريد الجهة.","الموظفون مدربون على الحذر من الروابط والمرفقات غير المتوقعة.","الموظفون مدربون على الإبلاغ عن الرسائل المشبوهة."],"ph":1,"ef":"medium","csf":["PR.PS-05","DE.CM-01","PR.AT-01"],"cis":["9.2","9.3","9.6","10.1","10.2"],"iso":["A.8.7","A.8.23"]},{"id":"PR-4.1","fn":"PR","t":"Approved Communication & Videoconferencing Platforms","tAr":"منصات التواصل والاجتماعات المرئية المعتمدة","r":"For official work (meetings, calls, messaging, screen sharing), use only Entity-approved communication and collaboration platforms. Do not use personal or unapproved apps (for example, private messaging, personal email, unauthorized remote-control tools) for work data or meetings. Maintain a simple list of approved platforms and ensure staff are aware of it. Where feasible, restrict installation or use of unapproved tools on corporate devices via configuration.","rAr":"تستخدم الجهة في الأعمال الرسمية من اجتماعات ومكالمات ومراسلة ومشاركة للشاشة منصات التواصل والتعاون المعتمدة منها وحدها، ولا تستخدم التطبيقات الشخصية أو غير المعتمدة كالمراسلة الخاصة والبريد الشخصي وأدوات التحكم عن بعد غير المصرح بها في بيانات العمل أو اجتماعاته، وتحفظ قائمة مبسطة بالمنصات المعتمدة وتضمن علم الموظفين بها، وتقيد متى أمكن تثبيت الأدوات غير المعتمدة أو استخدامها على أجهزة الجهة عن طريق الإعدادات.","p":"Reduce risk from unapproved chat/voice/video tools and remote control apps.","pAr":"تقليل المخاطر الناتجة عن أدوات المحادثة والصوت والفيديو والتحكم عن بعد غير المعتمدة.","ep":null,"epAr":null,"ck":["Only entity approved platforms are used for official meetings, calls, messaging and screen sharing.","Personal or unapproved apps are not used for work data or meetings.","Unauthorized remote control tools are not used for work.","A list of approved platforms is maintained.","Staff are made aware of the approved platform list.","Installation or use of unapproved tools on corporate devices is restricted by configuration where feasible."],"ckAr":["تستخدم المنصات المعتمدة من الجهة وحدها للاجتماعات والمكالمات والمراسلة ومشاركة الشاشة الرسمية.","لا تستخدم التطبيقات الشخصية أو غير المعتمدة لبيانات العمل أو اجتماعاته.","لا تستخدم أدوات التحكم عن بعد غير المصرح بها في العمل.","تحفظ قائمة بالمنصات المعتمدة.","الموظفون على علم بقائمة المنصات المعتمدة.","تثبيت الأدوات غير المعتمدة أو استخدامها على أجهزة الجهة مقيد بالإعدادات متى أمكن."],"ph":2,"ef":"low","csf":["PR.PS-01","GV.PO-01"],"cis":["2.3","2.5","2.7"],"iso":["A.5.14","A.8.19"]},{"id":"PR-4.2","fn":"PR","t":"Portable Media Device Control","tAr":"التحكم في وسائط التخزين الخارجية","r":"Where feasible, restrict or technically disable the use of unapproved portable storage media (e.g., USB drives) on Entity systems, especially those handling Sensitive data. Establish procedures to allow only authorized portable media if necessary for business, and train staff on proper usage of portable media devices.","rAr":"تقيد الجهة متى أمكن استخدام وسائط التخزين الخارجية غير المعتمدة كأقراص الناقل التسلسلي العام على أنظمتها أو تعطله تقنيا، ولا سيما الأنظمة التي تعالج بيانات حساسة، وتضع إجراءات لا تسمح إلا بوسائط التخزين الخارجية المصرح بها إذا اقتضت حاجة العمل ذلك، وتدرب الموظفين على الاستخدام السليم لأجهزة وسائط التخزين الخارجية.","p":"Limit the risks from use of unapproved removable media devices.","pAr":"الحد من مخاطر استخدام وسائط التخزين الخارجية غير المعتمدة.","ep":null,"epAr":null,"ck":["Use of unapproved portable storage media is restricted or technically disabled where feasible.","Systems handling Sensitive data receive the strictest portable media restriction.","A procedure exists to authorize portable media where a business need exists.","Only authorized portable media can be used.","Staff are trained on proper usage of portable media devices."],"ckAr":["استخدام وسائط التخزين الخارجية غير المعتمدة مقيد أو معطل تقنيا متى أمكن.","تخضع الأنظمة التي تعالج بيانات حساسة لأشد قيود وسائط التخزين الخارجية.","يوجد إجراء لاعتماد وسائط التخزين الخارجية عند وجود حاجة عمل.","وسائط التخزين الخارجية المصرح بها وحدها يمكن استخدامها.","الموظفون مدربون على الاستخدام السليم لأجهزة وسائط التخزين الخارجية."],"ph":2,"ef":"low","csf":["PR.DS-01","PR.PS-01"],"cis":["10.3","10.4","3.9"],"iso":["A.7.10","A.8.7"]},{"id":"PR-5","fn":"PR","t":"Data Protection, Backup & Lifecycle","tAr":"حماية البيانات والنسخ الاحتياطي ودورة حياتها","r":"Implement regular, automated backups for critical systems and data, with priority to Sensitive and Restricted data. Store backups in at least one separate location (for example, a separate network segment, storage system, or cloud account). Protect backup data from unauthorized access and tampering (e.g., access controls, encryption). Test restoration of backups for key systems at least annually. Define and apply retention periods and secure disposal procedures aligned with legal requirements and the National Data Classification Framework, ensuring Sensitive data is securely erased or destroyed when no longer needed. For Sensitive data, if backups involve storage outside Kuwait (such as cloud backups), obtain any required approvals in line with data sovereignty requirements.","rAr":"تنفذ الجهة نسخا احتياطية آلية منتظمة للأنظمة والبيانات الحرجة مع إعطاء الأولوية للبيانات الحساسة والمقيدة، وتحفظ النسخ في موقع منفصل واحد على الأقل كمقطع شبكي مستقل أو نظام تخزين آخر أو حساب سحابي، وتحمي بيانات النسخ الاحتياطي من الوصول غير المصرح به ومن العبث بضوابط الوصول والتشفير، وتختبر استعادة النسخ للأنظمة الرئيسية سنويا على الأقل، وتحدد وتطبق مدد الحفظ وإجراءات الإتلاف الآمن بما يتوافق مع المتطلبات القانونية ومع الإطار الوطني لتصنيف البيانات وبما يضمن محو البيانات الحساسة أو إتلافها بصورة آمنة عند انتفاء الحاجة إليها، أما البيانات الحساسة فإذا انطوت نسخها الاحتياطية على حفظ خارج الكويت كالنسخ السحابية وجب الحصول على أي موافقات مطلوبة وفق متطلبات سيادة البيانات.","p":"Ensure critical data is appropriately protected, can be restored, and is disposed of safely.","pAr":"ضمان حماية البيانات الحرجة على النحو المناسب وإمكانية استعادتها والتخلص منها بأمان.","ep":null,"epAr":null,"ck":["Regular automated backups run for critical systems and data.","Sensitive and Restricted data receive backup priority.","Backups are stored in at least one separate location.","Backup data is protected from unauthorized access.","Backup data is protected from tampering.","Restoration of backups for key systems is tested at least annually.","Retention periods are defined and applied.","Secure disposal procedures are defined and applied.","Retention and disposal align with legal requirements and the National Data Classification Framework.","Sensitive data is securely erased or destroyed when no longer needed.","Backups of Sensitive data held outside Kuwait carry the required approvals."],"ckAr":["تجرى نسخ احتياطية آلية منتظمة للأنظمة والبيانات الحرجة.","تعطى البيانات الحساسة والمقيدة أولوية في النسخ الاحتياطي.","تحفظ النسخ الاحتياطية في موقع منفصل واحد على الأقل.","بيانات النسخ الاحتياطي محمية من الوصول غير المصرح به.","بيانات النسخ الاحتياطي محمية من العبث.","تختبر استعادة النسخ الاحتياطية للأنظمة الرئيسية سنويا على الأقل.","مدد الحفظ محددة ومطبقة.","إجراءات الإتلاف الآمن محددة ومطبقة.","الحفظ والإتلاف متوائمان مع المتطلبات القانونية ومع الإطار الوطني لتصنيف البيانات.","تمحى البيانات الحساسة أو تتلف بصورة آمنة عند انتفاء الحاجة إليها.","تحمل النسخ الاحتياطية للبيانات الحساسة المحفوظة خارج الكويت الموافقات المطلوبة."],"ph":1,"ef":"high","csf":["PR.DS-11","PR.DS-01","PR.DS-10"],"cis":["11.1","11.2","11.3","11.4","11.5","3.5"],"iso":["A.8.13","A.8.10","A.8.24"]},{"id":"PR-6","fn":"PR","t":"Physical Protection of Critical IT Assets","tAr":"الحماية المادية للأصول التقنية الحرجة","r":"Identify critical IT areas (for example, data centers, server rooms, main network rooms, and locations where backup media are stored) and keep a simple list of them. For these areas, implement basic physical protections appropriate to the site, including at least:\n• Doors or cabinets that can be locked when the area is unattended.\n• Restricted access so that only authorized personnel can enter or unlock equipment (for example, keys, access cards, or codes managed by IT or facilities).\n• A simple record of non-routine visitors (such as contractors or vendors) to critical IT areas, which MAY be kept using existing building or guard logs.\nStore backup media and portable equipment (such as laptops) in a locked room or cabinet when not in use; avoid leaving them unattended in public or shared areas. This control focuses on the physical protection of IT assets and SHOULD make use of the entity’s existing building or facility security arrangements wherever possible.","rAr":"تحدد الجهة المناطق التقنية الحرجة كمراكز البيانات وغرف الخوادم وغرف الشبكة الرئيسية ومواقع حفظ وسائط النسخ الاحتياطي وتحفظ قائمة مبسطة بها، وتطبق على هذه المناطق حمايات مادية أساسية تناسب الموقع تشمل كحد أدنى ما يلي:\n• أبوابا أو خزائن يمكن قفلها عند خلو المنطقة.\n• وصولا مقيدا بحيث لا يدخل أو يفتح المعدات إلا المخولون، وذلك مثلا بمفاتيح أو بطاقات دخول أو رموز تديرها تقنية المعلومات أو إدارة المرافق.\n• سجلا مبسطا للزوار غير المعتادين كالمقاولين والموردين إلى المناطق التقنية الحرجة، ويجوز حفظه ضمن سجلات المبنى أو الحراسة القائمة.\nوتحفظ وسائط النسخ الاحتياطي والمعدات المحمولة كالحواسيب المحمولة في غرفة أو خزانة مقفلة عند عدم الاستخدام، مع تجنب تركها دون رقابة في الأماكن العامة أو المشتركة، ويركز هذا الضابط على الحماية المادية للأصول التقنية وينبغي أن يستفيد من ترتيبات أمن المبنى أو المرافق القائمة لدى الجهة حيثما أمكن.","p":"Reduce the risk of tampering, theft or damage to critical IT equipment.","pAr":"تقليل مخاطر العبث بالمعدات التقنية الحرجة أو سرقتها أو إتلافها.","ep":null,"epAr":null,"ck":["Critical IT areas are identified and listed.","Doors or cabinets in critical IT areas can be locked when unattended.","Access is restricted so only authorized personnel can enter or unlock equipment.","Keys, access cards or codes are managed by IT or facilities.","A record of non routine visitors to critical IT areas is kept.","Backup media are stored in a locked room or cabinet when not in use.","Portable equipment is stored in a locked room or cabinet when not in use.","Equipment is not left unattended in public or shared areas."],"ckAr":["المناطق التقنية الحرجة محددة ومدرجة في قائمة.","يمكن قفل الأبواب أو الخزائن في المناطق التقنية الحرجة عند خلوها.","الوصول مقيد بحيث لا يدخل أو يفتح المعدات إلا المخولون.","تدار المفاتيح وبطاقات الدخول والرموز من تقنية المعلومات أو إدارة المرافق.","يحفظ سجل بالزوار غير المعتادين للمناطق التقنية الحرجة.","تحفظ وسائط النسخ الاحتياطي في غرفة أو خزانة مقفلة عند عدم الاستخدام.","تحفظ المعدات المحمولة في غرفة أو خزانة مقفلة عند عدم الاستخدام.","لا تترك المعدات دون رقابة في الأماكن العامة أو المشتركة."],"ph":2,"ef":"low","csf":["PR.AA-06","ID.AM-01"],"cis":["1.1","12.1"],"iso":["A.7.1","A.7.2","A.7.3","A.7.4","A.7.10"]},{"id":"DE-1","fn":"DE","t":"Audit Logging & Monitoring","tAr":"تسجيل الأحداث والمراقبة","r":"Enable audit logging on critical systems, network devices, security tools, and key applications. At minimum, log authentication events, administrative actions, and important security events. Where feasible, centralize logs into a basic logging solution for easier review.\n• Restrict access to logs to authorized personnel only and protect logs from unauthorized modification or deletion (including logging configuration changes), prioritizing Critical Systems and the central logging solution where used.\n• Retain logs for at least 90 days live and 12 months in total (live or archived). Review logs for suspicious activity at a frequency appropriate to the Entity’s risk (for example, weekly for smaller Entities, daily for higher-risk environments).","rAr":"تفعل الجهة تسجيل التدقيق على الأنظمة الحرجة وأجهزة الشبكة وأدوات الأمن والتطبيقات الرئيسية، وتسجل كحد أدنى أحداث المصادقة والإجراءات الإدارية والأحداث الأمنية المهمة، وتجمع السجلات مركزيا في نظام تسجيل مركزي متى كان ذلك ممكنا تيسيرا للمراجعة.\n• ويقصر الوصول إلى السجلات على المخولين وحدهم، وتحمى السجلات من التعديل أو الحذف غير المصرح به بما في ذلك تغييرات إعدادات التسجيل، مع إعطاء الأولوية للأنظمة الحرجة ولحل التسجيل المركزي حيثما استخدم.\n• وتحفظ السجلات تسعين يوما على الأقل بصورة حية واثني عشر شهرا إجمالا حية كانت أو مؤرشفة، وتراجع بحثا عن نشاط مشبوه بوتيرة تناسب مخاطر الجهة، فأسبوعيا مثلا للجهات الأصغر ويوميا للبيئات الأعلى خطورة.","p":"Provide visibility into suspicious activity and support investigations.","pAr":"إتاحة رؤية للأنشطة المشبوهة ودعم التحقيقات.","ep":null,"epAr":null,"ck":["Audit logging is enabled on critical systems.","Audit logging is enabled on network devices.","Audit logging is enabled on security tools.","Audit logging is enabled on key applications.","Authentication events are logged.","Administrative actions are logged.","Important security events are logged
