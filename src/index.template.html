<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markaz | Kuwait Cybersecurity Research Centre</title>
<meta name="description" content="Open regulatory data for Kuwait and the Gulf. Browse the national baseline, its crosswalks and the tooling built against it.">
<style>
:root{
  --bg:#07080b; --panel:#0e1116; --panel2:#12161c; --raise:#171c23;
  --rule:#1d232b; --rule-hi:#2b333d;
  --ink:#eaeef2; --dim:#98a3ad; --faint:#5f6b76;
  --go:#14c88a; --amber:#e0a32e; --blue:#4a9edb; --red:#d14b3f;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --ar:"SF Arabic","Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --lift:inset 0 1px 0 rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:
    radial-gradient(1100px 460px at 50% -8%,rgba(20,200,138,.075),transparent 70%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  letter-spacing:-0.005em;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[dir="rtl"] body{font-family:var(--ar);line-height:1.85;letter-spacing:normal}
a{color:inherit}
button{font-family:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 22px}

/* Masthead */
.top{border-bottom:1px solid var(--rule);background:rgba(7,8,11,.9);
     backdrop-filter:blur(10px);position:sticky;top:0;z-index:60}
.top-in{display:flex;align-items:center;gap:13px;padding:12px 0}
.sig{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
     background:linear-gradient(150deg,var(--go),#068257);color:#02170f;
     font-family:var(--ar);font-size:17px;font-weight:700;box-shadow:var(--lift)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-0.015em;line-height:1.25}
html[dir="rtl"] .nm b{letter-spacing:normal}
.nm span{display:block;font-size:11.5px;color:var(--faint);line-height:1.35}
.lang{background:transparent;border:1px solid var(--rule-hi);color:var(--dim);
      padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.lang:hover{border-color:var(--go);color:var(--go)}

/* Opening figures */
.head{padding:34px 0 28px}
.head>p{max-width:62ch;color:var(--dim);font-size:15.5px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
      border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:24px}
.fig{background:linear-gradient(165deg,var(--panel2),var(--panel));padding:17px 18px;box-shadow:var(--lift)}
.fig b{display:block;font-family:var(--mono);font-size:30px;font-weight:660;
       letter-spacing:-0.04em;line-height:1.05;color:var(--go)}
.fig span{display:block;font-size:11px;color:var(--faint);margin-top:5px;
          letter-spacing:.08em;text-transform:uppercase}
html[dir="rtl"] .fig span{letter-spacing:normal;text-transform:none;font-size:12.5px}

/* Command bar: search across every corpus at once. */
.cmd{position:relative;margin-top:22px}
.cmd input{
  width:100%;background:linear-gradient(168deg,var(--panel2),var(--panel));
  border:1px solid var(--rule-hi);color:var(--ink);padding:13px 16px;
  border-radius:11px;font-size:15px;font-family:inherit;box-shadow:var(--lift);
}
.cmd input:focus{outline:none;border-color:var(--go)}
.cmd input::placeholder{color:var(--faint)}
.cmd-s{position:absolute;inset-inline-end:14px;top:14px;font-family:var(--mono);
       font-size:11px;color:var(--faint);pointer-events:none}
html[dir="rtl"] .cmd-s{font-family:var(--ar)}
.res{margin-top:11px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
     background:linear-gradient(168deg,var(--panel2),var(--panel));box-shadow:var(--lift)}
.res-g{border-bottom:1px solid var(--rule)}
.res-g:last-child{border-bottom:0}
.res-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
       padding:9px 15px 6px;font-weight:640;display:flex;gap:8px;align-items:baseline}
html[dir="rtl"] .res-h{letter-spacing:normal;text-transform:none;font-size:12px}
.res-h u{text-decoration:none;font-family:var(--mono);font-size:10.5px}
.hit{display:block;padding:9px 15px;border-top:1px solid var(--rule);cursor:pointer;
     text-decoration:none;color:inherit;text-align:start;background:none;border-inline:0;
     border-bottom:0;width:100%;font-family:inherit}
.hit:hover{background:var(--raise)}
.hit b{font-family:var(--mono);font-size:11.5px;color:var(--go);margin-inline-end:9px}
.hit span{font-size:13px;color:var(--ink)}
.hit em{font-style:normal;display:block;font-size:12.3px;color:var(--faint);
        line-height:1.5;margin-top:2px}
html[dir="rtl"] .hit em{line-height:1.7;font-size:13px}
.hit mark{background:rgba(20,200,138,.22);color:var(--go);border-radius:2px;padding:0 1px}
.loading{padding:11px 15px;font-size:12.5px;color:var(--faint)}

/* Review tool */
.rev{border-top:1px solid var(--rule)}
.rev-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:13px 16px;
         border-bottom:1px solid var(--rule)}
.rev-bar b{font-family:var(--mono);font-size:12px;color:var(--dim)}
.who{background:var(--raise);border:1px solid var(--rule-hi);color:var(--ink);
     padding:6px 11px;border-radius:7px;font-size:12.5px;font-family:inherit;min-width:170px}
.who:focus{outline:none;border-color:var(--go)}
.btn{background:var(--raise);border:1px solid var(--rule-hi);color:var(--dim);
     padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--go);color:var(--go)}
.btn.pri{background:var(--go);border-color:var(--go);color:#04120c;font-weight:650}
.btn.pri:hover{filter:brightness(1.1);color:#04120c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pair{padding:14px 16px;border-bottom:1px solid var(--rule)}
.pair:last-child{border-bottom:0}
.pair.done{opacity:.5}
.pair-h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pair-h b{font-family:var(--mono);font-size:12.5px;font-weight:660}
.pair-h i{font-style:normal;font-size:13px;color:var(--ink)}
.pair-h s{text-decoration:none;margin-inline-start:auto;font-family:var(--mono);
          font-size:11px;color:var(--faint)}
.conf{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid}
.conf.strong{color:var(--go);border-color:#0d5f43;background:#07231a}
.conf.moderate{color:var(--blue);border-color:#1d3f5c;background:#0a1c28}
.conf.weak{color:var(--faint);border-color:var(--rule-hi)}
html[dir="rtl"] .conf{font-family:var(--ar)}
.pair p{font-size:12.8px;color:var(--dim);line-height:1.55;
        border-inline-start:2px solid var(--rule-hi);padding-inline-start:11px}
html[dir="rtl"] .pair p{line-height:1.75;font-size:13.5px}
.pair-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.note{flex:1;min-width:180px;background:var(--raise);border:1px solid var(--rule);
      color:var(--ink);padding:6px 10px;border-radius:7px;font-size:12.5px;font-family:inherit}
.note:focus{outline:none;border-color:var(--go)}
.verdict{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px}
.verdict.ok{color:var(--go);background:#07231a;border:1px solid #0d5f43}
.verdict.no{color:var(--red);background:#241110;border:1px solid #5c2320}
html[dir="rtl"] .verdict{font-family:var(--ar)}

/* Section heading */
.sh{display:flex;align-items:baseline;gap:10px;padding:34px 0 12px}
.sh h2{font-size:18px;font-weight:660;letter-spacing:-0.02em}
html[dir="rtl"] .sh h2{letter-spacing:normal}
.sh em{font-style:normal;font-size:12.5px;color:var(--faint)}
.sh a{margin-inline-start:auto;font-size:12.5px;color:var(--go);text-decoration:none;white-space:nowrap}
.sh a:hover{text-decoration:underline}
.sub{color:var(--faint);font-size:13.5px;max-width:78ch;margin:-4px 0 16px}

/* Panel */
.panel{background:linear-gradient(168deg,var(--panel2),var(--panel));
       border:1px solid var(--rule);border-radius:13px;box-shadow:var(--lift);overflow:hidden}

/* Distribution bar */
.dist{display:flex;height:44px;width:100%}
.seg{border:0;padding:0;cursor:pointer;position:relative;transition:filter .12s;
     display:flex;align-items:center;justify-content:center;min-width:14px}
.seg:hover{filter:brightness(1.35)}
.seg b{font-family:var(--mono);font-size:12px;color:#04120c;font-weight:700}
.seg.off{filter:grayscale(.75) brightness(.5)}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:12px;border-top:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;
    border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--dim);font-size:12.5px}
.lg:hover{background:var(--raise);color:var(--ink)}
.lg.on{background:var(--raise);border-color:var(--rule-hi);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.lg u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* Control chips */
.ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
       gap:7px;padding:14px;border-top:1px solid var(--rule)}
.ct{background:var(--raise);border:1px solid var(--rule);border-inline-start:3px solid;
    border-radius:8px;padding:9px 11px;cursor:pointer;text-align:start;color:var(--ink)}
.ct:hover{border-color:var(--rule-hi);background:#1b212a}
.ct.sel{background:#1e2630;border-color:var(--go)}
.ct b{display:block;font-family:var(--mono);font-size:12px;font-weight:660;letter-spacing:-0.02em}
.ct span{display:block;font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:3px}
html[dir="rtl"] .ct span{line-height:1.65;font-size:12.5px}

/* Detail */
.det{border-top:1px solid var(--rule);padding:20px}
.det-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:4px}
.det-h b{font-family:var(--mono);font-size:15px;font-weight:660}
.det-h h3{font-size:17px;font-weight:650;letter-spacing:-0.015em}
html[dir="rtl"] .det-h h3{letter-spacing:normal}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.pill.fnp{color:#04120c;border-color:transparent;font-weight:700}
.pill.off{color:var(--go);border-color:#0d5f43;background:#07231a}
.pill.edi{color:var(--amber);border-color:#5c4415;background:#211809}
html[dir="rtl"] .pill{font-family:var(--ar)}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
     margin:15px 0 5px;font-weight:640}
html[dir="rtl"] .lbl{letter-spacing:normal;text-transform:none;font-size:12px}
.quote{border-inline-start:2px solid var(--rule-hi);padding-inline-start:14px;
       color:var(--ink);font-size:14px;line-height:1.62}
html[dir="rtl"] .quote{line-height:1.85}
.det p{color:var(--dim);font-size:13.8px}
.checks{list-style:none;counter-reset:c}
.checks li{counter-increment:c;position:relative;padding-inline-start:26px;
           color:var(--dim);font-size:13.3px;line-height:1.55;margin-bottom:5px}
html[dir="rtl"] .checks li{line-height:1.78;font-size:14px}
.checks li::before{content:counter(c,decimal-leading-zero);position:absolute;
  inset-inline-start:0;font-family:var(--mono);font-size:10.5px;color:var(--faint);top:2px}
.maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.map{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;
     border:1px solid var(--rule-hi);color:var(--dim)}
.map.csf{color:var(--blue);border-color:#1d3f5c}
.map.cis{color:var(--go);border-color:#0d5f43}
.map.iso{color:var(--faint)}
.hint{color:var(--faint);font-size:13px;padding:22px;text-align:center}

/* Crosswalk */
.xw{display:grid;grid-template-columns:250px 1fr;gap:1px;background:var(--rule)}
.xw>div{background:linear-gradient(168deg,var(--panel2),var(--panel));padding:18px}
.stat{margin-bottom:14px}
.stat b{display:block;font-family:var(--mono);font-size:23px;color:var(--go);
        font-weight:660;letter-spacing:-0.035em}
.stat span{font-size:11.5px;color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:12px}
.bar i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}
.track{height:7px;background:var(--raise);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.bar s{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint)}
.warnbox{margin-top:14px;padding:10px 12px;border-radius:8px;background:#211809;
         border:1px solid #5c4415;color:var(--amber);font-size:12.5px}

/* Datasets */
.dsets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.dset{background:linear-gradient(168deg,var(--panel2),var(--panel));border:1px solid var(--rule);
      border-radius:12px;padding:16px 17px;box-shadow:var(--lift);display:flex;flex-direction:column}
.dset b{font-family:var(--mono);font-size:26px;color:var(--go);font-weight:660;letter-spacing:-0.035em}
.dset u{text-decoration:none;font-size:11px;color:var(--faint);margin-inline-start:6px}
.dset h4{font-size:14px;font-weight:640;margin:7px 0 5px}
.dset p{color:var(--dim);font-size:12.8px;line-height:1.55;flex:1}
html[dir="rtl"] .dset p{line-height:1.78;font-size:13.5px}
.dl{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.dl a{font-family:var(--mono);font-size:10.5px;color:var(--go);text-decoration:none;
      border:1px solid #0d5f43;padding:2px 8px;border-radius:5px}
.dl a:hover{background:#07231a}

/* Rows */
.rows{border-top:1px solid var(--rule)}
.row{display:block;padding:13px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.row:hover{background:var(--panel)}
.r-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.r-id{font-family:var(--mono);font-size:13.5px;font-weight:650;letter-spacing:-0.02em;overflow-wrap:anywhere}
.row:hover .r-id{color:var(--go)}
.r-ttl{font-weight:620;font-size:14px}
.r-meta{margin-inline-start:auto;display:flex;gap:11px;font-family:var(--mono);
        font-size:10.5px;color:var(--faint);white-space:nowrap}
.r-meta s{text-decoration:none}
.r-meta .st{color:var(--amber)}
.r-meta .op{color:var(--go)}
html[dir="rtl"] .r-meta .op,html[dir="rtl"] .r-meta .nl{font-family:var(--ar);letter-spacing:normal}
.r-desc{color:var(--dim);font-size:13px;line-height:1.55;margin-top:3px;max-width:92ch}
html[dir="rtl"] .r-desc{line-height:1.78;font-size:13.8px}

/* Filter */
.bar2{position:sticky;top:59px;background:var(--bg);z-index:30;padding:10px 0 0}
.q{width:100%;background:var(--panel2);border:1px solid var(--rule-hi);color:var(--ink);
   padding:9px 13px;border-radius:8px;font-size:14px;font-family:inherit}
.q:focus{outline:none;border-color:var(--go)}
.q::placeholder{color:var(--faint)}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 4px}
.tab{background:transparent;border:1px solid transparent;color:var(--dim);padding:4px 9px;
     border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.on{background:var(--go);color:#04120c;font-weight:650}
.tab u{text-decoration:none;font-family:var(--mono);opacity:.6;margin-inline-start:5px;font-size:10.5px}
.grp{padding:16px 0 0}
.grp-h{font-size:12.5px;font-weight:650;color:var(--dim);padding-bottom:6px;
       border-bottom:1px solid var(--rule-hi);display:flex;gap:9px;align-items:baseline}
.grp-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-inline-start:auto}

.mir{padding:4px 0}
.mir p{color:var(--faint);font-size:12.5px;max-width:76ch;margin-bottom:10px}
.mir div{display:flex;flex-wrap:wrap;gap:5px}
.mir a{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-decoration:none;
       border:1px solid var(--rule);padding:2px 7px;border-radius:5px}
.mir a:hover{color:var(--dim);border-color:var(--rule-hi)}
.none{color:var(--faint);padding:24px 0;font-size:14px}
footer{border-top:1px solid var(--rule);margin-top:38px;padding:20px 0 40px;
       color:var(--faint);font-size:12.5px}
.fi{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fi a{color:var(--dim);text-decoration:none}
.fi a:hover{color:var(--go)}

@media(max-width:820px){
  .xw{grid-template-columns:1fr}
  .dsets{grid-template-columns:1fr}
}
@media(max-width:680px){
  .w{padding:0 15px}
  .head{padding:24px 0 20px}
  .head>p{font-size:14.5px}
  .figs{grid-template-columns:repeat(2,1fr)}
  .fig b{font-size:25px}
  .sh{padding:28px 0 10px}
  .sh h2{font-size:16.5px}
  .ctrls{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;padding:11px}
  .dist{height:38px}
  .seg b{font-size:11px}
  .bar2{top:56px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:9px -15px 4px;padding:0 15px 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .r-meta{margin-inline-start:0;margin-top:5px;flex-wrap:wrap}
  .bar{grid-template-columns:64px 1fr auto}
}
</style>
</head>
<body>

<header class="top"><div class="w"><div class="top-in">
  <div class="sig">م</div>
  <div class="nm"><b id="nm"></b><span id="tg"></span></div>
  <button class="lang" id="lang" onclick="toggle()"></button>
</div></div></header>

<div class="w">
  <div class="head">
    <p id="lede"></p>
    <div class="figs" id="figs"></div>
    <div class="cmd">
      <input id="cmd" oninput="doSearch()" autocomplete="off" spellcheck="false">
      <span class="cmd-s" id="cmd-s"></span>
    </div>
    <div id="res"></div>
  </div>

  <div class="sh"><h2 id="h-ex"></h2><a href="corpus/kw-nbcc/controls.json" id="a-ex"></a></div>
  <p class="sub" id="s-ex"></p>
  <div class="panel">
    <div class="dist" id="dist"></div>
    <div class="legend" id="legend"></div>
    <div class="ctrls" id="ctrls"></div>
    <div class="det" id="det"></div>
  </div>

  <div class="sh"><h2 id="h-xw"></h2><a href="publications/0002-validated-regulatory-crosswalk/" id="a-xw"></a></div>
  <p class="sub" id="s-xw"></p>
  <div class="panel"><div class="xw">
    <div id="xw-l"></div><div id="xw-r"></div>
  </div>
  <div class="rev">
    <div style="padding:15px 16px 0"><div style="font-size:14.5px;font-weight:640" id="h-rev"></div>
      <p style="color:var(--faint);font-size:12.8px;max-width:82ch;margin-top:4px" id="s-rev"></p></div>
    <div class="rev-bar" id="rev-bar"></div>
    <div id="rev"></div>
  </div></div>

  <div class="sh"><h2 id="h-ds"></h2><a href="corpus/" id="a-ds"></a></div>
  <div class="dsets" id="dsets"></div>

  <div class="sh"><h2 id="h-pub"></h2><a href="publications/" id="a-pub"></a></div>
  <div class="rows" id="pub"></div>

  <div class="sh"><h2 id="h-idx"></h2><em id="e-idx"></em></div>
  <div class="bar2">
    <input class="q" id="q" oninput="render()" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="out"></div>

  <div class="sh"><h2 id="h-mir"></h2></div>
  <div class="mir"><p id="p-mir"></p><div id="mir"></div></div>
</div>

<footer><div class="w"><div class="fi">
  <span id="f1"></span>
  <span><a href="https://github.com/SiteQ8/Markaz/blob/main/CHARTER.md" id="f2"></a>
  &nbsp;&middot;&nbsp; <a href="https://github.com/SiteQ8" id="f3"></a></span>
</div></div></footer>

  document.title=s.nm+" | "+s.tg;

function counts(){
  const c={};C.controls.forEach(x=>c[x.fn]=(c[x.fn]||0)+1);return c;
}

function paintExplorer(){

    const n=cn[f.id]||0;
    return '<button class="seg'+(fnFilter!=="*"&&fnFilter!==f.id?" off":"")+'" style="flex:'+n+

  }).join("");
  el("legend").innerHTML='<button class="lg'+(fnFilter==="*"?" on":"")+'" onclick="setFn(\'*\')">'+
    s.all+'<u dir="ltr">'+tot+'</u></button>'+
    C.fn.map(f=>'<button class="lg'+(fnFilter===f.id?" on":"")+'" onclick="setFn(\''+f.id+'\')">'+

      '<u dir="ltr">'+(cn[f.id]||0)+'</u></button>').join("");

  const list=C.controls.filter(c=>fnFilter==="*"||c.fn===fnFilter);
  el("ctrls").innerHTML=list.map(c=>
    '<button class="ct'+(sel===c.id?" sel":"")+'" style="border-inline-start-color:'+FN[c.fn].color+

function paintDetail(){

  if(!sel){el("det").innerHTML='<p class="hint">'+s.pick+'</p>';return;}
  const c=C.controls.find(x=>x.id===sel),f=FN[c.fn];
  const official=!!c.p, purpose=official?(L()?c.pAr:c.p):(L()?c.epAr:c.ep);
  const checks=L()?c.ckAr:c.ck;
  const maps=[].concat(
    c.csf.map(m=>'<span class="map csf" dir="ltr">CSF '+esc(m)+'</span>'),
    c.cis.map(m=>'<span class="map cis" dir="ltr">CIS '+esc(m)+'</span>'),
    c.iso.map(m=>'<span class="map iso" dir="ltr">ISO '+esc(m)+'</span>'));
  el("det").innerHTML=
    '<div class="det-h"><b dir="ltr">'+esc(c.id)+'</b><h3>'+esc(L()?c.tAr:c.t)+'</h3>'+
      '<span class="pill fnp" style="background:'+f.color+'">'+esc(L()?f.nameAr:f.name)+'</span>'+
      '<span class="pill" style="color:var(--faint);border-color:var(--rule-hi)">'+
        s.phase+' '+c.ph+' &middot; '+s.effort+' '+esc(c.ef)+'</span></div>'+
    (purpose?'<div class="lbl">'+s.purpose+' <span class="pill '+(official?"off":"edi")+'">'+
      (official?s.offP:s.ediP)+'</span></div><p>'+esc(purpose)+'</p>':"")+
    '<div class="lbl">'+s.req+'</div><div class="quote">'+esc(L()?c.rAr:c.r)+'</div>'+
    (checks&&checks.length?'<div class="lbl">'+s.checks+' <span style="color:var(--faint)" dir="ltr">'+

      checks.map(k=>'<li>'+esc(k)+'</li>').join("")+'</ul>':"")+
    (maps.length?'<div class="lbl">'+s.maps+'</div><div class="maps">'+maps.join("")+'</div>':"");

function setFn(id){fnFilter=(fnFilter===id)?"*":id;sel=null;paintExplorer();}
function setCtl(id){sel=(sel===id)?null:id;paintExplorer();

function paintXwalk(){
  const s=t(),k=C.xw.counts;
  el("xw-l").innerHTML=
    '<div class="stat"><b dir="ltr">'+k.candidate_pairs+'</b><span>'+s.xwP+'</span></div>'+
    '<div class="stat"><b dir="ltr">'+C.xw.d+'</b><span>'+s.xwD+'</span></div>'+
    '<p style="color:var(--dim);font-size:12.8px">'+s.xwV+'</p>'+
    '<div class="warnbox">'+s.xwWarn+'</div>';
  const mx=Math.max(k.strong,k.moderate,k.weak);
  const bar=(lab,n,col)=>'<div class="bar"><i>'+lab+'</i><div class="track">'+
    '<div class="fill" style="width:'+(n/mx*100)+'%;background:'+col+'"></div></div>'+
    '<s dir="ltr">'+n+'</s></div>';
  el("xw-r").innerHTML='<div class="bars">'+
    bar(s.xwS,k.strong,"var(--go)")+bar(s.xwM,k.moderate,"var(--blue)")+bar(s.xwW,k.weak,"var(--faint)")+
    '</div><div class="lbl">'+s.xwTop+'</div><div class="bars">'+
    C.xw.top.slice(0,8).map(p=>'<div class="bar"><i dir="ltr">'+esc(p.n)+'</i>'+

      '<s dir="ltr">'+esc(p.c)+'</s></div>').join("")+'</div>';

function paintPubs(){

function paintTabs(){
  const s=t(),c={};
  DATA.projects.forEach(p=>c[p.domain]=(c[p.domain]||0)+1);
  el("tabs").innerHTML='<button class="tab '+(domain==="*"?"on":"")+'" onclick="pick(\'*\')">'+
    s.all+'<u>'+DATA.stats.projects+'</u></button>'+
    DATA.domains.map(d=>'<button class="tab '+(domain===d.id?"on":"")+'" onclick="pick(\''+d.id+'\')">'+
      (L()?d.ar:d.en)+'<u>'+(c[d.id]||0)+'</u></button>').join("");

function pick(d){domain=d;paintTabs();render();}

function render(){
  const s=t(),term=el("q").value.trim().toLowerCase();
  const hits=DATA.projects.filter(p=>{
    if(domain!=="*"&&p.domain!==domain)return false;
    if(!term)return true;
    return (p.name+" "+p.description+" "+p.ar+" "+p.language+" "+p.topics.join(" ")).toLowerCase().indexOf(term)>-1;
  });
  if(!hits.length){el("out").innerHTML='<p class="none">'+s.none+'</p>';return;}
  el("out").innerHTML=DATA.domains.filter(d=>hits.some(p=>p.domain===d.id)).map(d=>{
    const rs=hits.filter(p=>p.domain===d.id).sort((a,b)=>b.stars-a.stars||b.size_kb-a.size_kb);
    return '<section class="grp"><div class="grp-h"><span>'+(L()?d.ar:d.en)+'</span><em>'+rs.length+
      '</em></div><div class="rows">'+rs.map(row).join("")+'</div></section>';
  }).join("");
}

function row(p){
  const s=t(),m=[];
  if(p.language)m.push('<s dir="ltr">'+esc(p.language)+'</s>');
  if(p.stars)m.push('<s class="st" dir="ltr">'+p.stars+'</s>');
  m.push((p.license&&p.license!=="NOASSERTION")?'<s dir="ltr">'+esc(p.license)+'</s>'
    :'<s class="nl">'+s.nolic+'</s>');
  if(p.pages)m.push('<s class="op">'+s.open+'</s>');
  return '<a class="row" href="'+(p.pages||p.url)+'" target="_blank" rel="noopener">'+
    '<div class="r-top"><span class="r-id" dir="ltr">'+esc(p.name)+'</span>'+
    '<span class="r-meta">'+m.join("")+'</span></div><div class="r-desc">'+
    esc(L()?(p.ar||""):(p.description||""))+'</div></a>';
}


/* ---- Lazy corpora. The page paints from embedded data, then pulls the larger
   corpora in the background so search can reach all 1,133 records. ---- */
let CORF=null, XW=null;
async function lazy(){
  const grab=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null;}catch(e){return null;}};
  const got=await Promise.all([grab("data/corf-lite.json"),grab("data/xwalk-lite.json")]);
  CORF=got[0];XW=got[1];
  paintScope();paintReview();if(el("cmd").value.trim())doSearch();
}
function paintScope(){
  const s=t(),n=44+(CORF?CORF.n:0)+(XW?XW.p.length:0);
  el("cmd-s").textContent=n.toLocaleString(L()?"ar-EG":"en")+" "+s.records;
}

/* ---- Deep links: every control is citable. ---- */
function readHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(h.indexOf("c/")===0){
    const id=h.slice(2);
    if(C.controls.some(x=>x.id===id)){sel=id;fnFilter="*";paintExplorer();
      setTimeout(function(){el("det").scrollIntoView({block:"center"});},60);}
  } else if(h.indexOf("q/")===0){el("cmd").value=h.slice(2);doSearch();}
}
function setHash(h){
  if(location.hash!=="#"+h)history.replaceState(null,"",h?"#"+h:location.pathname);
}
addEventListener("hashchange",readHash);

/* ---- Global search across every corpus. ---- */
function hl(txt,term){
  txt=txt||"";
  const i=txt.toLowerCase().indexOf(term);
  if(i<0)return esc(txt.slice(0,150));
  const a=Math.max(0,i-55),b=Math.min(txt.length,i+term.length+95);
  return (a>0?"&hellip;":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+term.length))+
         "</mark>"+esc(txt.slice(i+term.length,b))+(b<txt.length?"&hellip;":"");
}
function doSearch(){
  const s=t(),raw=el("cmd").value.trim(),term=raw.toLowerCase();
  setHash(raw?"q/"+raw:"");
  if(term.length<2){el("res").innerHTML="";return;}
  const G=[];

  const ctl=[];
  C.controls.forEach(function(c){
    const fields=[c.id,c.t,c.tAr,c.r,c.rAr,c.p||"",c.pAr||"",c.ep||"",c.epAr||""];
    const inChecks=(c.ck||[]).concat(c.ckAr||[]).filter(function(k){return k.toLowerCase().indexOf(term)>-1;});
    const hitField=fields.filter(function(f){return f&&f.toLowerCase().indexOf(term)>-1;})[0];
    if(hitField||inChecks.length){
      ctl.push('<button class="hit" onclick="goCtl(\''+c.id+'\')">'+
        '<b dir="ltr">'+esc(c.id)+'</b><span>'+esc(L()?c.tAr:c.t)+'</span><em>'+
        hl(inChecks[0]||(L()?c.rAr:c.r),term)+'</em></button>');
    }
  });
  if(ctl.length)G.push([s.gCtl,ctl]);

  if(CORF){
    const h=[];
    for(let i=0;i<CORF.c.length&&h.length<25;i++){
      const c=CORF.c[i];
      if(c.t.toLowerCase().indexOf(term)>-1||c.k.toLowerCase().indexOf(term)>-1){
        h.push('<a class="hit" href="corpus/kw-corf/controls.json" target="_blank" rel="noopener">'+
          '<b dir="ltr">'+esc(c.k)+'</b><span>'+esc(c.d||"")+'</span>'+
          '<em dir="ltr" style="text-align:start">'+hl(c.t,term)+'</em></a>');
      }
    }
    if(h.length)G.push([s.gCorf,h]);
  }

  if(XW){
    const h=XW.p.filter(function(p){
      return (p.n+" "+p.nt+" "+p.c+" "+p.tx).toLowerCase().indexOf(term)>-1;
    }).slice(0,15).map(function(p){
      return '<a class="hit" href="corpus/kw-crosswalk/nbcc-corf.json" target="_blank" rel="noopener">'+
        '<b dir="ltr">'+esc(p.n)+' &rarr; '+esc(p.c)+'</b>'+
        '<span class="conf '+p.cf+'">'+s.cf[p.cf]+'</span><em>'+hl(p.tx,term)+'</em></a>';
    });
    if(h.length)G.push([s.gXw,h]);
  }

  const prj=DATA.projects.filter(function(p){
    return (p.name+" "+p.description+" "+p.ar+" "+p.topics.join(" ")).toLowerCase().indexOf(term)>-1;
  }).slice(0,12).map(function(p){
    return '<a class="hit" href="'+(p.pages||p.url)+'" target="_blank" rel="noopener">'+
      '<b dir="ltr">'+esc(p.name)+'</b><em>'+hl(L()?(p.ar||""):(p.description||""),term)+'</em></a>';
  });
  if(prj.length)G.push([s.gPrj,prj]);

  el("res").innerHTML=G.length
    ? '<div class="res">'+G.map(function(g){
        return '<div class="res-g"><div class="res-h">'+g[0]+'<u dir="ltr">'+g[1].length+
          '</u></div>'+g[1].join("")+'</div>';}).join("")+'</div>'+
      (!CORF?'<div class="loading">'+s.loading+'</div>':"")
    : '<div class="res"><div class="loading">'+s.noHit+'</div></div>';
}
function goCtl(id){
  sel=id;fnFilter="*";paintExplorer();setHash("c/"+id);
  el("det").scrollIntoView({block:"center",behavior:"smooth"});
}

/* ---- Review tool. Decisions stay in memory and leave as a file, because a
   confirmation with no named reviewer is worth no more than the proposal. ---- */
const AR_TITLE={};C.controls.forEach(function(c){AR_TITLE[c.id]=c.tAr;});
const REV={};
let revWho="",revFilter="strong";
function setWho(v){revWho=v.trim();paintReview();}
function setRevFilter(v){revFilter=v;paintReview();}
function decide(key,verdict){
  const n=el("note-"+key);
  REV[key]={verdict:verdict,note:n?n.value.trim():"",by:revWho};
  paintReview();
}
function undo(key){delete REV[key];paintReview();}
function exportRev(){
  const rows=Object.keys(REV).map(function(k){
    const p=XW.p.filter(function(x){return x.n+"|"+x.c===k;})[0];
    return {nbcc:p.n,corf:p.c,score:p.s,confidence:p.cf,
      status:REV[k].verdict==="ok"?"confirmed":"rejected",
      decision:REV[k].verdict==="ok"?"equivalent":"not equivalent",
      reviewed_by:REV[k].by,note:REV[k].note};
  });
  const blob=new Blob([JSON.stringify({reviewed:rows.length,reviewer:revWho,pairs:rows},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="crosswalk-review.json";a.click();
  URL.revokeObjectURL(a.href);
}
function paintReview(){
  const s=t();
  if(!XW){el("rev-bar").innerHTML='<span class="loading">'+s.loading+'</span>';el("rev").innerHTML="";return;}
  const done=Object.keys(REV).length;
  el("rev-bar").innerHTML=
    '<b dir="ltr">'+done+' / '+XW.p.length+'</b>'+
    '<input class="who" id="who" value="'+esc(revWho)+'" oninput="setWho(this.value)" placeholder="'+s.who+'">'+
    ["strong","moderate","weak"].map(function(k){
      return '<button class="btn'+(revFilter===k?" pri":"")+'" onclick="setRevFilter(\''+k+'\')">'+
        s.cf[k]+' <span dir="ltr">'+XW.n[k]+'</span></button>';}).join("")+
    '<button class="btn" onclick="exportRev()"'+(done&&revWho?"":" disabled")+'>'+s.exp+'</button>';

  el("rev").innerHTML=XW.p.filter(function(p){return p.cf===revFilter;}).slice(0,40).map(function(p){
    const key=p.n+"|"+p.c,r=REV[key];
    return '<div class="pair'+(r?" done":"")+'">'+
      '<div class="pair-h"><b dir="ltr">'+esc(p.n)+'</b><i>'+
      esc(L()?(AR_TITLE[p.n]||p.nt):p.nt)+'</i>'+
      '<span class="conf '+p.cf+'">'+esc(p.dm||"")+'</span>'+
      '<s dir="ltr">'+esc(p.c)+' &middot; '+p.s+'</s></div>'+
      (L()?'<div style="font-size:11px;color:var(--faint);margin-bottom:4px">'+s.srcEn+'</div>':"")+
      '<p dir="ltr" style="text-align:start">'+esc(p.tx)+'</p>'+
      (r?'<div class="pair-a"><span class="verdict '+r.verdict+'">'+(r.verdict==="ok"?s.vOk:s.vNo)+'</span>'+
          (r.note?'<span style="font-size:12.3px;color:var(--faint)">'+esc(r.note)+'</span>':"")+
          '<button class="btn" onclick="undo(\''+key+'\')">'+s.undo+'</button></div>'
        :'<div class="pair-a"><input class="note" id="note-'+key+'" placeholder="'+s.why+'">'+
          '<button class="btn pri" onclick="decide(\''+key+'\',\'ok\')"'+(revWho?"":" disabled")+'>'+s.ok+'</button>'+
          '<button class="btn" onclick="decide(\''+key+'\',\'no\')"'+(revWho?"":" disabled")+'>'+s.no+'</button></div>')+
      '</div>';
  }).join("");
}

paint();render();readHash();lazy();
</script>
